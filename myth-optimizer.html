<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Myth Level Optimizer</title>
<style>:root {
  --bg: #0d0f14; --panel: #151922; --panel2: #1b2130; --line: #262d3d; --text: #e6e9f0; --muted: #8b95aa;
  --gold: #f0b429; --gold-dim: #8a6a1c; --pve: #4ecb8d; --hp: #6aa9ff; --bad: #ff6b6b;
  --radius: 10px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { padding: 18px 24px 8px; max-width: 1280px; margin: 0 auto; }
h1 { margin: 0; font-size: 22px; letter-spacing: .2px; }
h1 span { color: var(--gold); }
.sub { color: var(--muted); margin-top: 4px; max-width: 840px; }
main { max-width: 1280px; margin: 0 auto; padding: 8px 24px 40px; display: grid; grid-template-columns: 300px 1fr; gap: 16px; align-items: start; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.panel h2 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
label.f { display: block; margin: 10px 0 4px; color: var(--muted); font-size: 12px; }
select, input[type=number], input[type=text] { width: 100%; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; font: inherit; }
input[type=range] { width: 100%; accent-color: var(--gold); }
.row { display: flex; gap: 8px; align-items: center; }
.row > * { flex: 1; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px; font: inherit; font-size: 12px; cursor: pointer; }
button:hover { border-color: var(--gold-dim); }
.stats { max-height: 330px; overflow: auto; border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; background: var(--panel2); }
.stats label { display: flex; gap: 8px; align-items: center; padding: 2px 0; cursor: pointer; font-size: 13px; }
.stats .grp { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin: 8px 0 2px; }
.stats .grp:first-child { margin-top: 0; }
.hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-bottom: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.card .k { color: var(--muted); font-size: 12px; }
.card .v { font-size: 22px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
.card .s { color: var(--muted); font-size: 12px; margin-top: 2px; }
.card.hi { border-color: var(--gold-dim); }
.card.hi .v { color: var(--gold); }
.v small { font-size: 13px; font-weight: 500; color: var(--muted); }
.pos { color: var(--bad); } .pve { color: var(--pve); }
.chartwrap { position: relative; }
svg.chart { width: 100%; height: auto; display: block; touch-action: none; cursor: crosshair; }
svg.chart text { fill: var(--muted); font-size: 11px; }
.tip { color: var(--muted); font-size: 12px; min-height: 18px; margin-top: 4px; font-variant-numeric: tabular-nums; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 6px 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.n, th.n { text-align: right; }
tr.pve td:first-child { box-shadow: inset 3px 0 var(--pve); }
tr.hp td:first-child { box-shadow: inset 3px 0 var(--hp); }
tr.zone td { background: var(--panel2); color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; padding: 4px 8px; }
.tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; font-weight: 600; }
.tag.pve { background: rgba(78,203,141,.14); color: var(--pve); }
.tag.hp { background: rgba(106,169,255,.14); color: var(--hp); }
.acc { color: var(--text); } .acc i { color: var(--muted); font-style: normal; }
.scroll { max-height: 640px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
.status { color: var(--muted); font-size: 12px; margin: 0 0 8px; min-height: 16px; }
.spin { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--gold-dim); border-top-color: var(--gold); border-radius: 50%; animation: s .8s linear infinite; vertical-align: -1px; margin-right: 6px; }
@keyframes s { to { transform: rotate(360deg); } }
.note { font-size: 12px; color: var(--muted); margin-top: 12px; line-height: 1.55; }
.sec { margin-top: 14px; }
.sec > .hd { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.sec h3 { margin: 0; font-size: 14px; }
.chk { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; }

.legend { display: flex; gap: 14px; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.dot.pve { background: var(--pve); } .dot.hp { background: var(--hp); } .dot.off { background: #4a5266; }
.mapwrap { position: relative; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: #0a0b0d; }
.mapwrap svg { display: block; width: 100%; height: auto; }
.mtip { position: absolute; z-index: 5; pointer-events: none; max-width: 330px; background: #0f1218; border: 1px solid var(--gold-dim); border-radius: 8px; padding: 9px 11px; font-size: 12px; line-height: 1.5; box-shadow: 0 8px 24px rgba(0,0,0,.5); font-variant-numeric: tabular-nums; }
.mtip b { color: var(--text); } .mtip .m { color: var(--muted); } .mtip .st { margin: 4px 0; }
.nd { cursor: pointer; } .nd circle.c { transition: stroke-width .1s; } .nd:hover circle.c { stroke-width: 4; }

.nodeedit { margin-top: 12px; }
.ed { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.edh { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .edh .m { color: var(--muted); flex: 1; }
.edstats { display: flex; flex-wrap: wrap; gap: 4px 16px; }
.edstats label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
.rules { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.rule { background: rgba(240,180,41,.1); border: 1px solid var(--gold-dim); border-radius: 99px; padding: 2px 4px 2px 10px; font-size: 12px; }
.rule a { color: var(--gold); text-decoration: none; } .rule button { border: 0; background: none; padding: 0 6px; font-size: 14px; color: var(--muted); }

.row2 { display: flex; gap: 8px; align-items: center; } .row2 select { width: auto; padding: 4px 8px; font-size: 12px; }
tr.keep td { opacity: .72; } tr.keep .tag { background: rgba(139,149,170,.18); color: var(--muted); }
.curroll { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; } .curroll select { width: auto; min-width: 170px; }
.istline { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; font-size: 12px; color: var(--muted); }
.istline b { color: var(--text); }
.edh button { padding: 3px 8px; }

button.danger { border-color: var(--bad); color: var(--bad); }
button:disabled { opacity: .45; cursor: default; }

.hbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.lang { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
.lang button { border: 0; border-radius: 0; background: transparent; padding: 5px 12px; color: var(--muted); font-weight: 600; }
.lang button.on { background: var(--gold); color: #1a1405; }
.foot { max-width: 1280px; margin: 0 auto; padding: 0 24px 28px; color: var(--muted); font-size: 12px; line-height: 1.55; }

[hidden] { display: none !important; }
.modes { display: flex; width: fit-content; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
.modes button { border: 0; border-radius: 0; background: transparent; padding: 7px 16px; color: var(--muted); font-weight: 600; font-size: 13px; }
.modes button.on { background: var(--gold); color: #1a1405; }
tr.next td { background: rgba(78,203,141,.08); }

a.nodelink { color: var(--text); text-decoration: none; border-bottom: 1px dotted var(--muted); font-weight: 600; }
a.nodelink:hover { color: var(--gold); border-bottom-color: var(--gold); }

/* three columns on wide screens: targets | results | stats overview */
header, main, .foot { max-width: 1600px; }
main { grid-template-columns: 300px minmax(0, 1fr) 300px; }
.rightcol { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
table.stat { font-size: 13px; }
table.stat td, table.stat th { padding: 4px 6px; }
table.stat tr.zone td { padding: 4px 6px; }
table.stat td.n.dim { color: var(--muted); }
@media (max-width: 1500px) {
  main { grid-template-columns: 300px minmax(0, 1fr); }
  .rightcol { grid-column: 1 / -1; position: static; max-height: none; }
}
@media (max-width: 900px) { main { grid-template-columns: 1fr; } }
/* inputs in one row sit on the same line even when one label wraps */
.row.end { align-items: flex-end; }

.leftcol { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.guide summary { cursor: pointer; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.guide[open] summary { margin-bottom: 10px; }
.guide ol, .guide ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.5; }
.guide li { margin-bottom: 8px; }
.guide li b { color: var(--text); }
.guide h4 { margin: 12px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
/* the panel title lives in the table header: title top-left, rank text bottom-left, column headers on the same lines */
table.stat th { vertical-align: bottom; }
table.stat th.rk { text-align: left; text-transform: none; letter-spacing: 0; padding-left: 0; }
table.stat th.rk .ttl { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; margin-bottom: 14px; }
table.stat th.rk .ttl { cursor: pointer; user-select: none; }
table.stat th.rk .ttl::before { content: "\25BE"; display: inline-block; width: 1.1em; transition: transform .12s; }
#statpanel.collapsed table.stat th.rk .ttl::before { transform: rotate(-90deg); }
#statpanel.collapsed table.stat tbody, #statpanel.collapsed table.stat th.n, #statpanel.collapsed .hint { display: none; }
#statpanel.collapsed table.stat th { border-bottom: 0; }
#statpanel.collapsed table.stat th.rk .ttl { margin-bottom: 6px; }
table.stat th.rk .rank { font-size: 13px; font-weight: 500; color: var(--muted); white-space: nowrap; }

/* optional DPS values per stat */
.dpsgrid { display: grid; grid-template-columns: 1fr 96px; gap: 6px 10px; align-items: center; margin-top: 10px; }
.dpsgrid label { font-size: 13px; }
.dpsgrid input { padding: 4px 8px; }
.guide summary .flag { margin-left: 6px; color: var(--gold); text-transform: none; letter-spacing: 0; font-weight: 600; }
.guide summary .flag::before { content: "● "; }
#stats.off { opacity: .45; pointer-events: none; }

/* total DPS above the stats overview */
#dpspanel table.stat tr.tot td { font-weight: 700; border-top: 1px solid var(--line); }
.tg { cursor: pointer; user-select: none; white-space: nowrap; }
.tg::before { content: "▾"; display: inline-block; width: 1.1em; transition: transform .12s; }
.tg[aria-expanded="false"]::before { transform: rotate(-90deg); }
#dpspanel table.stat tr.tot td { font-size: 16px; color: var(--gold); }
#dpspanel table.stat tr.tot td.n { font-size: 18px; }
.dpsline { font-size: 13px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.dpsline .tg { text-transform: uppercase; letter-spacing: .08em; font-weight: 600; color: var(--muted); }
.dpsline b { color: var(--gold); font-size: 16px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
  <div class="hbar">
    <h1 data-i18n-html="h1">Myth Level <span>Optimizer</span></h1>
    <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="de">DE</button></div>
  </div>
  <div class="sub" data-i18n="sub"></div>
</header>
<main>
  <div class="leftcol">
  <aside class="panel">
    <h2 data-i18n="hTarget"></h2>
    <div id="rankbox">
      <label class="f" for="rank" data-i18n="lblRank"></label>
      <select id="rank"></select>
    </div>
    <label class="f" for="stmode" data-i18n="lblStigma"></label>
    <select id="stmode"><option value="auto" data-i18n="optAuto"></option><option value="manual" data-i18n="optManual"></option></select>
    <div id="st-auto">
      <div class="row end">
        <div><label class="f" for="stlevel" data-i18n="lblStLevel"></label><input id="stlevel" type="number" min="1" max="150" value="1"></div>
        <div><label class="f" for="stprog" data-i18n="lblStProg"></label><input id="stprog" type="number" min="0" step="1" value="0"></div>
      </div>
      <div class="hint" id="stinfo"></div>
    </div>
    <div id="st-man" hidden>
      <label class="f" for="stigma" data-i18n="lblStManual"></label>
      <input id="stigma" type="number" min="0" max="150" value="0">
    </div>
    <h2 style="margin-top:18px" data-i18n="hPve"></h2>
    <div class="hint" id="pvedps" data-i18n="hintPveDps" hidden></div>
    <div class="stats" id="stats"></div>
    <div class="hint" data-i18n="hintPve"></div>
  </aside>
  <details class="panel guide" id="guide">
    <summary data-i18n="guideTitle"></summary>
    <ol>
      <li data-i18n-html="guide1"></li>
      <li data-i18n-html="guide2"></li>
      <li data-i18n-html="guide3"></li>
      <li data-i18n-html="guide4"></li>
      <li data-i18n-html="guide5"></li>
    </ol>
    <h4 data-i18n="guideGoodTitle"></h4>
    <ul>
      <li data-i18n-html="guideTip1"></li>
      <li data-i18n-html="guideTip2"></li>
      <li data-i18n-html="guideTip3"></li>
      <li data-i18n-html="guideTip4"></li>
    </ul>
  </details>
  <details class="panel guide" id="dpsbox">
    <summary><span data-i18n="dpsTitle"></span> <span class="flag" id="dpsflag" hidden data-i18n="dpsActive"></span></summary>
    <div class="hint" data-i18n="dpsIntro"></div>
    <div class="dpsgrid" id="dpsgrid"></div>
    <div class="btns"><button type="button" id="dpsclear" data-i18n="dpsClear"></button></div>
  </details>
  </div>
  <section>
    <div class="modes" role="group"><button type="button" data-mode="goal" data-i18n="modeGoal"></button><button type="button" data-mode="upgrade" data-i18n="modeUpgrade"></button></div>
    <p class="status" id="status"></p>
    <div class="cards" id="cards"></div>
    <div class="panel" id="chartpanel">
      <div class="sec" style="margin-top:0">
        <div class="hd"><h3 id="hcost" data-i18n="hCost"></h3></div>
        <div class="row" style="margin-bottom:10px">
          <div><label class="f" style="margin-top:0" for="slots" id="lblslots" data-i18n="lblSlots"></label><input id="slots" type="range" min="0" max="0" value="0" step="1"></div>
          <div style="max-width:210px"><label class="f" style="margin-top:0" for="budget" data-i18n="lblBudget"></label><input id="budget" type="number" min="0" step="1" value="0"></div>
        </div>
        <div class="chartwrap" id="chart"></div>
        <div class="tip" id="tip"></div>
      </div>
    </div>
    <div class="panel sec" id="mapsec" hidden>
      <div class="hd"><h3 id="maptitle" data-i18n="mapTitleDefault"></h3>
        <div class="legend"><span><i class="dot pve"></i><span data-i18n="legPve"></span></span><span><i class="dot hp"></i><span data-i18n="legHp"></span></span><span><i class="dot off"></i><span data-i18n="legOff"></span></span></div></div>
      <div class="mapwrap" id="mapwrap"><div id="map"></div><div class="mtip" id="mtip" hidden></div></div>
      <div id="nodeedit" class="nodeedit"></div>
    </div>
    <div class="panel sec" id="upsec" hidden>
      <div class="hd"><h3 data-i18n="upTitle"></h3></div>
      <p class="m" id="upintro" data-i18n="upIntro"></p>
      <label class="chk" style="margin:0 0 8px"><input type="checkbox" id="upall"> <span data-i18n="upScopeAll"></span></label>
      <div class="m" id="upinfo" style="margin:6px 0 10px"></div>
      <div id="uptable"></div>
    </div>
    <div class="panel sec" id="plansec" hidden>
      <div class="hd"><h3 id="plantitle" data-i18n="planTitleDefault"></h3>
        <div class="row2"><label class="chk" for="sortsel" data-i18n="lblSort"></label>
          <select id="sortsel"><option value="eff" data-i18n="optSortEff"></option><option value="node" data-i18n="optSortNode"></option></select>
          <button id="copy" type="button" data-i18n="btnCopy"></button></div></div>
      <div id="plan"></div>
    </div>
    <div class="note" data-i18n="modelNote"></div>
  </section>
  <div class="rightcol">
    <aside class="panel" id="dpspanel" hidden><div id="dpsbody"></div></aside>
    <aside class="panel" id="statpanel">
      <div id="statbody"></div>
      <div class="hint" data-i18n="statsNote"></div>
    </aside>
  </div>
</main>
<footer class="foot" data-i18n="footer"></footer>

<script id="worker-src" type="application/json">"// Myth Level optimizer core. Works in Node and in a Web Worker (no DOM).\r\n// Model (mirrors nipperlug.com/myth-level-planner):\r\n//  - each node re-rolls one (stat, level) outcome with probability p; cost per re-roll = nodeCost\r\n//  - you stop at the first accepted outcome -> expected Myth Points = nodeCost / P(accepted set)\r\n//  - node Holy Power = pool holyPower + zone bonus; zones unlock at a total-HP threshold\r\n//  - stigma adds flat HP on top of the node HP\r\n// Extension: per node, besides \"any roll with HP >= t\" (hpOnly), also \"PvE roll with HP >= t\"\r\n// (counted as a PvE slot). A second DP dimension counts PvE slots, so one run yields the\r\n// cheapest cost for every slot count.\r\n(function (root) {\r\n  const ZONES = [\r\n    { from: 1, to: 16, req: 0, bonus: 0 },\r\n    { from: 17, to: 31, req: 1150, bonus: 20 },\r\n    { from: 32, to: 46, req: 2750, bonus: 40 },\r\n    { from: 47, to: 59, req: 4550, bonus: 60 },\r\n    { from: 60, to: 78, req: 6450, bonus: 80 },\r\n  ];\r\n  const RANKS = [\r\n    ['kerubim', 'Kerubim', 4000], ['ofanim', 'Ofanim', 7000], ['dominion', 'Dominion', 10000],\r\n    ['angelus', 'Angelus', 13500], ['archangel', 'Archangel', 16500], ['raphael', 'Raphael', 19300],\r\n    ['uriel', 'Uriel', 22200], ['michael', 'Michael', 24500], ['metatron', 'Metatron', 27500],\r\n  ].map(([id, name, hp]) => ({ id, name, hp }));\r\n  const NODE_COST = [3,3,3,5,5,5,5,5,5,10,7,10,7,10,7,10, 7,7,7,7,7,7,7,7,15,10,15,10,15,10,15,\r\n    9,9,9,9,9,9,9,9,20,13,20,13,20,13,20, 11,11,11,11,11,11,13,16,25,16,25,16,13,\r\n    30,15,30,15,30,15,30,35,35,35,18,18,18,18,18,18,50,50,50];\r\n  // flat stats granted by each rank (cumulative: reaching a rank keeps the bonuses of all lower ranks)\r\n  const RANK_BONUS = [\r\n    { hp: 0, bonus: { HP: 50 } }, { hp: 4000, bonus: { Defense: 30 } }, { hp: 7000, bonus: { HP: 100 } },\r\n    { hp: 10000, bonus: { 'Ignore Penetration': 30 } }, { hp: 13500, bonus: { 'All Attack Up': 40 } },\r\n    { hp: 16500, bonus: { 'Critical Damage': 6 } }, { hp: 19300, bonus: { 'All Skill Amplification': 4 } },\r\n    { hp: 22200, bonus: { 'All Attack Up': 80 } }, { hp: 24500, bonus: { 'Critical Damage': 12 } },\r\n    { hp: 27500, bonus: { 'All Skill Amplification': 8 } },\r\n  ];\r\n  const rankBonus = (totalHp) => {\r\n    const out = {};\r\n    for (const r of RANK_BONUS) if (totalHp >= r.hp) for (const [k, v] of Object.entries(r.bonus)) out[k] = (out[k] || 0) + v;\r\n    return out;\r\n  };\r\n  const STIGMA = [0,10,15,20,25,30,35,40,45,50,55,64,73,82,91,100,109,118,127,136,145,158,171,184,197,210,223,236,249,262,275,292,309,326,343,360,377,394,411,428,445,466,487,508,529,550,571,592,613,634,655,680,705,730,755,780,805,830,855,880,905,934,963,992,1021,1050,1079,1108,1137,1166,1195,1228,1261,1294,1327,1360,1393,1426,1459,1492,1525,1562,1599,1636,1673,1710,1747,1784,1821,1858,1895,1936,1977,2018,2059,2100,2141,2182,2223,2264,2305,2349,2393,2437,2481,2525,2572,2619,2666,2713,2760,2810,2860,2910,2960,3010,3063,3116,3169,3222,3275,3330,3385,3440,3495,3550,3606,3662,3718,3774,3830,3887,3944,4001,4058,4115,4173,4231,4289,4347,4405,4464,4523,4582,4641,4700,4760,4820,4880,4940,5000];\r\n  // Stigma: row L of the table is what it costs to get from level L to L+1 (L=1 is free); the costs add up.\r\n  // [last level of the band, cost per level in Myth Points]\r\n  const STIGMA_BANDS = [[1, 0], [5, 74], [10, 93], [15, 112], [20, 130], [25, 149], [30, 167], [35, 186], [40, 205],\r\n    [45, 223], [50, 242], [55, 260], [60, 279], [65, 298], [70, 409], [75, 521], [80, 632], [85, 744], [90, 930],\r\n    [95, 1116], [100, 1302], [105, 1562], [110, 1934], [115, 2306], [120, 2678], [125, 2976], [130, 3348],\r\n    [135, 3422], [140, 3497], [145, 3571], [150, 3646]];\r\n  const STIGMA_COST = [0];   // index = level\r\n  for (let l = 1; l <= 150; l++) STIGMA_COST[l] = STIGMA_BANDS.find((b) => l <= b[0])[1];\r\n  const STIGMA_CUM = [0, 0]; // total Myth Points spent when a level is reached; index = level\r\n  for (let l = 2; l <= 150; l++) STIGMA_CUM[l] = STIGMA_CUM[l - 1] + STIGMA_COST[l - 1];\r\n  // highest level whose cumulative cost has been paid (level 2 is reached without spending anything)\r\n  const stigmaLevel = (spent) => {\r\n    let lo = 1, hi = 150;\r\n    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (STIGMA_CUM[mid] <= spent) lo = mid; else hi = mid - 1; }\r\n    return lo;\r\n  };\r\n  const stigmaHpAt = (spent) => STIGMA[stigmaLevel(spent)] || 0;\r\n  // \"I am at level L and have already spent p points towards the next level\"\r\n  const stigmaSpentFor = (level, progress) => {\r\n    const L = Math.min(150, Math.max(1, level | 0));\r\n    return STIGMA_CUM[L] + Math.min(Math.max(0, progress || 0), Math.max(0, STIGMA_COST[L] - 1));\r\n  };\r\n  const zoneOf = (id) => ZONES.find((z) => id >= z.from && id <= z.to);\r\n\r\n  // Default PvE whitelist: stats that raise PvE damage. Neutral variants (\"Critical Damage\") count,\r\n  // \"Pvp ...\" never does. Users can override per stat in the UI.\r\n  const CORE_PVE = ['All Attack Up', 'Critical Damage', 'Normal Damage Up', 'Add Damage',\r\n    'Ignore Damage Reduction', 'Penetration', 'Ignore Resist Skill Amplification',\r\n    'All Skill Amplification', 'Ignore Resist Critical Damage'];\r\n  const SECONDARY_PVE = ['Attack Rate', 'Accuracy', 'Ignore Evasion', 'Cancel Ignore Penetration'];\r\n  const baseName = (n) => n.replace(/^(Pve|Pvp) /, '');\r\n  const isPvp = (n) => /^Pvp /.test(n);\r\n\r\n  function prepareNodes(data) {\r\n    return data.map((n) => {\r\n      const z = zoneOf(n.nodeId);\r\n      const outcomes = [];\r\n      let maxVal = {};\r\n      for (const st of n.stats) {\r\n        for (const l of st.levels) {\r\n          outcomes.push({ stat: st.name, level: l.level, value: l.value, hp: l.holyPower + z.bonus, p: l.finalProbability / 100 });\r\n          maxVal[st.name] = Math.max(maxVal[st.name] || 0, l.value);\r\n        }\r\n      }\r\n      for (const o of outcomes) o.share = o.value / maxVal[o.stat];\r\n      return { id: n.nodeId, cost: NODE_COST[n.nodeId - 1], zone: z, outcomes };\r\n    });\r\n  }\r\n\r\n  function gcdAll(nodes, extra) {\r\n    const g = (a, b) => (b ? g(b, a % b) : a);\r\n    let r = 0;\r\n    for (const n of nodes) { for (const o of n.outcomes) r = g(r, o.hp); r = g(r, n.zone.req); }\r\n    for (const e of extra) r = g(r, e);\r\n    return r || 1;\r\n  }\r\n\r\n  // Pareto-reduce options sorted by hp: drop an option if a higher-hp one is not more expensive\r\n  function pareto(list) {\r\n    list.sort((a, b) => a.hp - b.hp || a.cost - b.cost);\r\n    const out = [];\r\n    for (const o of list) {\r\n      while (out.length && out[out.length - 1].cost >= o.cost) out.pop();\r\n      out.push(o);\r\n    }\r\n    return out;\r\n  }\r\n\r\n  function nodeOptions(node, isEligible, force, curOutcome) {\r\n    const opts = [];\r\n    if (curOutcome) {\r\n      const el = isEligible(curOutcome);\r\n      if (!force || el) opts.push({ hp: curOutcome.hp, cost: 0, pve: el ? 1 : 0, P: 1, expHp: curOutcome.hp, setSize: 1, thr: curOutcome.hp, keep: true });\r\n    }\r\n    const build = (pred, pve) => {\r\n      const acc = node.outcomes.filter(pred);\r\n      const hps = [...new Set(acc.map((o) => o.hp))].sort((a, b) => a - b);\r\n      const list = [];\r\n      for (const t of hps) {\r\n        const set = acc.filter((o) => o.hp >= t);\r\n        const P = set.reduce((s, o) => s + o.p, 0);\r\n        if (P <= 0) continue;\r\n        const exp = set.reduce((s, o) => s + o.p * o.hp, 0) / P;\r\n        list.push({ hp: Math.min(...set.map((o) => o.hp)), cost: node.cost / P, pve, P, expHp: exp, setSize: set.length, thr: t });\r\n      }\r\n      return pareto(list);\r\n    };\r\n    if (!force) opts.push(...build(() => true, 0));\r\n    opts.push(...build(isEligible, 1));\r\n    return opts;\r\n  }\r\n\r\n  // Which outcomes count as PvE on a node: the node's own stat list if it has one, otherwise the global list.\r\n  function makeEligibility(allowed, rules, minShare) {\r\n    const global = (o) => !isPvp(o.stat) && allowed.has(baseName(o.stat)) && o.share >= (minShare || 0) - 1e-9;\r\n    const eligibleFor = (id) => {\r\n      const r = rules[id];\r\n      if (r && r.stats) { const set = new Set(r.stats); return (o) => !isPvp(o.stat) && set.has(baseName(o.stat)); }\r\n      return global;\r\n    };\r\n    return { eligibleFor, isEligible: global };\r\n  }\r\n  // current state { [nodeId]: { stat, level } } -> the outcome each node carries right now (or null)\r\n  const currentOutcomes = (nodes, current) => nodes.map((n) => {\r\n    const c = (current || {})[n.id];\r\n    return c ? n.outcomes.find((o) => o.stat === c.stat && o.level === c.level) || null : null;\r\n  });\r\n\r\n  // cfg: { rankHp, stigma, allowed:Set<baseName>, minShare, maxSlots, hpOnlyAllowed }\r\n  function solve(data, cfg) {\r\n    const nodes = prepareNodes(data);\r\n    // stigma: 'manual' = fixed level; 'auto' = level follows the total spent Myth Points (fixed point below)\r\n    const auto = cfg.stigmaMode === 'auto';\r\n    const spent0 = auto ? Math.max(0, cfg.spent || 0) : 0;\r\n    const S0 = auto ? stigmaLevel(spent0) : Math.min(150, Math.max(0, cfg.stigma || 0));\r\n    const stigmaHp = STIGMA[S0] || 0;   // reference: zone gating and the DP cap use the level you have at the start\r\n    const target = Math.max(0, cfg.rankHp - stigmaHp);\r\n    const minShare = cfg.minShare || 0;\r\n    const rules = cfg.nodeRules || {};\r\n    const { eligibleFor, isEligible } = makeEligibility(cfg.allowed, rules, minShare);\r\n    const g = gcdAll(nodes, []);\r\n    const cap = Math.ceil(target / g);\r\n    if (cap <= 0) {\r\n      return { g, cap: 0, target: 0, stigmaHp, KMAX: 0, nodes, nodeOpts: [], costExact: [0],\r\n        best: [{ slots: 0, bestExactSlots: 0, cost: 0 }], trace: () => [], minShare, isEligible, eligibleFor,\r\n        auto, spent0, S0, sStar: [S0], current: [] };\r\n    }\r\n    const current = currentOutcomes(nodes, cfg.current);\r\n    const nodeOpts = nodes.map((n, i) => nodeOptions(n, eligibleFor(n.id), !!(rules[n.id] && rules[n.id].force), current[i]));\r\n    const maxEligibleNodes = nodeOpts.filter((o) => o.some((x) => x.pve)).length;\r\n    const KMAX = Math.min(cfg.maxSlots == null ? 78 : cfg.maxSlots, maxEligibleNodes);\r\n    const W = cap + 1, KW = KMAX + 1;\r\n    const INF = Infinity;\r\n    let cur = new Float64Array(W * KW).fill(INF);\r\n    let nxt = new Float64Array(W * KW);\r\n    cur[0] = 0;\r\n    const choice = [];     // per node: Uint8Array(W*KW), 0=skip\r\n    const capPrev = [];    // per node: Uint16Array(KW) prev hp for cap-column states\r\n    let maxHpSoFar = 0;\r\n    for (let ni = 0; ni < nodes.length; ni++) {\r\n      const node = nodes[ni];\r\n      const opts = nodeOpts[ni].map((o) => ({ ...o, h: Math.round(o.hp / g) }));\r\n      const reqU = Math.max(0, Math.ceil((node.zone.req - stigmaHp) / g));\r\n      const forced = !!(rules[node.id] && rules[node.id].force);\r\n      if (forced || current[ni]) nxt.fill(INF); else nxt.set(cur);\r\n      const ch = new Uint8Array(W * KW);\r\n      const cp = new Uint16Array(KW);\r\n      const hiHp = Math.min(cap, maxHpSoFar);\r\n      for (let k = 0; k <= Math.min(KMAX, ni); k++) {\r\n        const base = k * W;\r\n        for (let e = 0; e <= hiHp; e++) {\r\n          const c0 = cur[base + e];\r\n          if (c0 === INF) continue;\r\n          // zone gate: in auto mode the stigma earned by the Myth Points spent so far already counts\r\n          let gateOk = e >= reqU;\r\n          if (!gateOk && auto) gateOk = e * g + stigmaHpAt(spent0 + c0) >= node.zone.req;\r\n          for (let oi = 0; oi < opts.length; oi++) {\r\n            const o = opts[oi];\r\n            if (!gateOk && !o.keep) continue;   // zone still locked; an existing roll stays\r\n            const k2 = k + o.pve;\r\n            if (k2 > KMAX) continue;\r\n            const e2 = e + o.h > cap ? cap : e + o.h;\r\n            const idx = k2 * W + e2;\r\n            const c = c0 + o.cost;\r\n            if (c < nxt[idx]) {\r\n              nxt[idx] = c; ch[idx] = oi + 1;\r\n              if (e2 === cap) cp[k2] = e;\r\n            }\r\n          }\r\n        }\r\n      }\r\n      let top = 0; for (const o of opts) if (o.h > top) top = o.h;\r\n      maxHpSoFar += top;\r\n      choice.push(ch); capPrev.push(cp);\r\n      const t = cur; cur = nxt; nxt = t;\r\n    }\r\n    // Stigma fixed point. Cost with final level S is the cheapest state with node-HP >= rank - bonus(S), read\r\n    // from the one DP table (suffix minima); the plan is consistent if spending that much unlocks level >= S.\r\n    const suf = new Float64Array(W * KW), arg = new Int32Array(W * KW);\r\n    for (let k = 0; k <= KMAX; k++) {\r\n      let m = INF, a = -1;\r\n      for (let h = cap; h >= 0; h--) { const v = cur[k * W + h]; if (v < m) { m = v; a = h; } suf[k * W + h] = m; arg[k * W + h] = a; }\r\n    }\r\n    const capOf = (S) => Math.max(0, Math.ceil((cfg.rankHp - (STIGMA[S] || 0)) / g));\r\n    const cands = auto ? Array.from({ length: 150 - S0 + 1 }, (_, i) => 150 - i) : [S0];\r\n    const costExact = [], sStar = [], hStart = [];\r\n    for (let k = 0; k <= KMAX; k++) {\r\n      let pick = null;\r\n      for (const S of cands) {\r\n        const cS = Math.min(cap, capOf(S)), c = suf[k * W + cS];\r\n        if (c === INF || c < 0) continue;\r\n        if (!auto || stigmaLevel(spent0 + c) >= S) { pick = { S, c, h: arg[k * W + cS] }; break; }\r\n      }\r\n      if (pick) { costExact.push(pick.c); sStar.push(pick.S); hStart.push(pick.h); } else { costExact.push(INF); sStar.push(S0); hStart.push(-1); }\r\n    }\r\n    function trace(k0) {\r\n      let k = k0, e = hStart[k0]; const plan = [];\r\n      for (let ni = nodes.length - 1; ni >= 0; ni--) {\r\n        const c = choice[ni][k * W + e];\r\n        if (c === 0) continue;          // skipped (state carried o pts.push({ hp: curOutcome.hp, cost: 0, pve: el ? 1 : 0, P: 1, expHp: curOutcome.hp, dps: dpsOf(curOutcome), setSize: 1, thr: curOutcome.hp, minDps: 0, keep: true });\r\n    }\r\n    const cand = [];\r\n    const build = (pool, pve, perStat) => {\r\n      const hps = [...new Set(pool.map((o) => o.hp))];\r\n      const ss = perStat ? [...new Set(pool.map(dpsOf))] : [0];\r\n      for (const t of hps) for (const s of ss) {\r\n        let P = 0, eh = 0, ed = 0, mh = Infinity, n = 0;\r\n        for (const o of pool) {\r\n          if (o.hp < t || dpsOf(o) < s - 1e-9) continue;\r\n          P += o.p; eh += o.p * o.hp; ed += o.p * dpsOf(o); n++;\r\n          if (o.hp < mh) mh = o.hp;\r\n        }\r\n        if (P > 0) cand.push({ hp: mh, cost: node.cost / P, pve, P, expHp: eh / P, dps: ed / P, setSize: n, thr: t, minDps: s });\r\n      }\r\n    };\r\n    if (!force) build(node.outcomes, 0, false);\r\n    build(node.outcomes.filter(isEligible), 1, true);\r\n    // drop options that another one beats on HP, DPS and cost at once\r\n    cand.sort((a, b) => a.cost - b.cost || b.hp - a.hp || b.dps - a.dps || b.pve - a.pve);\r\n    const kept = [];\r\n    for (const c of cand) if (!kept.some((k) => k.hp >= c.hp && k.dps >= c.dps - 1e-12)) kept.push(c);\r\n    opts.push(...kept);\r\n    return opts;\r\n  }\r\n\r\n  // cfg: like solve() plus weights { [baseStatName]: value per stat point }\r\n  function solveDps(data, cfg) {\r\n    const t0 = Date.now();\r\n    const nodes = prepareNodes(data);\r\n    const auto = cfg.stigmaMode === 'auto';\r\n    const spent0 = auto ? Math.max(0, cfg.spent || 0) : 0;\r\n    const S0 = auto ? stigmaLevel(spent0) : Math.min(150, Math.max(0, cfg.stigma || 0));\r\n    const stigmaHp = STIGMA[S0] || 0;\r\n    const target = Math.max(0, cfg.rankHp - stigmaHp);\r\n    const rules = cfg.nodeRules || {};\r\n    const { eligibleFor, isEligible } = makeEligibility(cfg.allowed, rules, 0);\r\n    const dpsOf = dpsFn(cfg.weights || {});\r\n    const g = gcdAll(n R) continue;\r\n      const vP = P.dps - lam * P.cost, vR = R.dps - lam * R.cost;\r\n      if (vR > vP + 1e-7 * Math.abs(vP) + 1e-9 && R.cost > P.cost + 1e-9 && R.cost < Q.cost - 1e-9) { pts.push(R); segs.push([P, R], [R, Q]); }\r\n    }\r\n    // The slot solver's cheapest plan is what the UI calls the cheapest path in both modes. The exact search can find a plan\r\n    // up to ~1 % cheaper (it tracks the Stigma gates exactly), so the curve starts at the slot solver's value for consistency.\r\n    const slotCheapest = solve(data, { ...cfg, maxSlots: 0 }).costExact[0];\r\n    const floor = isFinite(slotCheapest) ? slotCheapest - 1e-6 : 0;\r\n    const frontier = (list) => {\r\n      const kept = list.filter((p) => p.cost >= floor);\r\n      list = (kept.length ? kept : list).filter((p) => p.cost <= costCap).sort((a, b) => a.cost - b.cost || b.dps - a.dps);\r\n      const out = [];\r\n      for (const p of list) if (!out.length || p.dps > out[out.length - 1].dps + 1e-9) out.push(p);\r\n      return out;\r\n    };\r\n    const hull = frontier(pts);\r\n    const tHull = Date.now() - t0;\r\n\r\n    // 2) Gap filling. The hull only holds the points a multiplier can reach; between two neighbours there are better\r\n    //    plans (the frontier is not convex). Neighbouring hull plans differ in few nodes, so an exact search over the\r\n    //    options they use (all nodes, exact HP/cost/DPS, no rounding) finds them.\r\n    const hpCap = Math.max(target, topReq - stigmaHp);\r\n    const finalS = (c) => (auto ? stigmaLevel(spent0 + c) : S0);\r\n    const dq = (hull[hull.length - 1].dps - hull[0].dps) / 4000 || 1;\r\n    const prune = (states) => {     // keep the states no other state beats on HP, DPS and cost at once\r\n      states.sort((a, b) => b.h - a.h || b.d - a.d || a.c - b.c);\r\n      const front = [], out = [];\r\n      for (const st of states) {\r\n        let lo = 0, hi = front.length;\r\n        while (lo < hi) { const m = (lo + hi) >> 1; if (front[m].c <= st   }

  function gcdAll(nodes, extra) {
    const g = (a, b) => (b ? g(b, a % b) : a);
    let r = 0;
    for (const n of nodes) { for (const o of n.outcomes) r = g(r, o.hp); r = g(r, n.zone.req); }
    for (const e of extra) r = g(r, e);
    return r || 1;
  }

  // Pareto-reduce options sorted by hp: drop an option if a higher-hp one is not more expensive
  function pareto(list) {
    list.sort((a, b) => a.hp - b.hp || a.cost - b.cost);
    const out = [];
    for (const o of list) {
      while (out.length && out[out.length - 1].cost >= o.cost) out.pop();
      out.push(o);
    }
    return out;
  }

  function nodeOptions(node, isEligible, force, curOutcome) {
    const opts = [];
    if (curOutcome) {
      const el = isEligible(curOutcome);
      if (!force || el) opts.push({ hp: curOutcome.hp, cost: 0, pve: el ? 1 : 0, P: 1, expHp: curOutcome.hp, setSize: 1, thr: curOutcome.hp, keep: true });
    }
    const build = (pred, pve) => {
      const acc = node.outcomes.filter(pred);
      const hps = [...new Set(acc.map((o) => o.hp))].sort((a, b) => a - b);
      const list = [];
      for (const t of hps) {
        const set = acc.filter((o) => o.hp >= t);
        const P = set.reduce((s, o) => s + o.p, 0);
        if (P <= 0) continue;
        const exp = set.reduce((s, o) => s + o.p * o.hp, 0) / P;
        list.push({ hp: Math.min(...set.map((o) => o.hp)), cost: node.cost / P, pve, P, expHp: exp, setSize: set.length, thr: t });
      }
      return pareto(list);
    };
    if (!force) opts.push(...build(() => true, 0));
    opts.push(...build(isEligible, 1));
    return opts;
  }

  // Which outcomes count as PvE on a node: the node's own stat list if it has one, otherwise the global list.
  function makeEligibility(allowed, rules, minShare) {
    const global = (o) => !isPvp(o.stat) && allowed.has(baseName(o.stat)) && o.share >= (minShare || 0) - 1e-9;
    const eligibleFor = (id) => {
      const r = rules[id];
      if (r && r.stats) { const set = new Set(r.stats); return (o) => !isPvp(o.stat) && set.has(baseName(o.stat)); }
      return global;
    };
    return { eligibleFor, isEligible: global };
  }
  // current state { [nodeId]: { stat, level } } -> the outcome each node carries right now (or null)
  const currentOutcomes = (nodes, current) => nodes.map((n) => {
    const c = (current || {})[n.id];
    return c ? n.outcomes.find((o) => o.stat === c.stat && o.level === c.level) || null : null;
  });

  // cfg: { rankHp, stigma, allowed:Set<baseName>, minShare, maxSlots, hpOnlyAllowed }
  function solve(data, cfg) {
    const nodes = prepareNodes(data);
    // stigma: 'manual' = fixed level; 'auto' = level follows the total spent Myth Points (fixed point below)
    const auto = cfg.stigmaMode === 'auto';
    const spent0 = auto ? Math.max(0, cfg.spent || 0) : 0;
    const S0 = auto ? stigmaLevel(spent0) : Math.min(150, Math.max(0, cfg.stigma || 0));
    const stigmaHp = STIGMA[S0] || 0;   // reference: zone gating and the DP cap use the level you have at the start
    const target = Math.max(0, cfg.rankHp - stigmaHp);
    const minShare = cfg.minShare || 0;
    const rules = cfg.nodeRules || {};
    const { eligibleFor, isEligible } = makeEligibility(cfg.allowed, rules, minShare);
    const g = gcdAll(nodes, []);
    const cap = Math.ceil(target / g);
    if (cap <= 0) {
      return { g, cap: 0, target: 0, stigmaHp, KMAX: 0, nodes, nodeOpts: [], costExact: [0],
        best: [{ slots: 0, bestExactSlots: 0, cost: 0 }], trace: () => [], minShare, isEligible, eligibleFor,
        auto, spent0, S0, sStar: [S0], current: [] };
    }
    const current = currentOutcomes(nodes, cfg.current);
    const nodeOpts = nodes.map((n, i) => nodeOptions(n, eligibleFor(n.id), !!(rules[n.id] && rules[n.id].force), current[i]));
    const maxEligibleNodes = nodeOpts.filter((o) => o.some((x) => x.pve)).length;
    const KMAX = Math.min(cfg.maxSlots == null ? 78 : cfg.maxSlots, maxEligibleNodes);
    const W = cap + 1, KW = KMAX + 1;
    const INF = Infinity;
    let cur = new Float64Array(W * KW).fill(INF);
    let nxt = new Float64Array(W * KW);
    cur[0] = 0;
    const choice = [];     // per node: Uint8Array(W*KW), 0=skip
    const capPrev = [];    // per node: Uint16Array(KW) prev hp for cap-column states
    let maxHpSoFar = 0;
    for (let ni = 0; ni < nodes.length; ni++) {
      const node = nodes[ni];
      const opts = nodeOpts[ni].map((o) => ({ ...o, h: Math.round(o.hp / g) }));
      const reqU = Math.max(0, Math.ceil((node.zone.req - stigmaHp) / g));
      const forced = !!(rules[node.id] && rules[node.id].force);
      if (forced || current[ni]) nxt.fill(INF); else nxt.set(cur);
      const ch = new Uint8Array(W * KW);
      const cp = new Uint16Array(KW);
      const hiHp = Math.min(cap, maxHpSoFar);
      for (let k = 0; k <= Math.min(KMAX, ni); k++) {
        const base = k * W;
        for (let e = 0; e <= hiHp; e++) {
          const c0 = cur[base + e];
          if (c0 === INF) continue;
          // zone gate: in auto mode the stigma earned by the Myth Points spent so far already counts
          let gateOk = e >= reqU;
          if (!gateOk && auto) gateOk = e * g + stigmaHpAt(spent0 + c0) >= node.zone.req;
          for (let oi = 0; oi < opts.length; oi++) {
            const o = opts[oi];
            if (!gateOk && !o.keep) continue;   // zone still locked; an existing roll stays
            const k2 = k + o.pve;
            if (k2 > KMAX) continue;
            const e2 = e + o.h > cap ? cap : e + o.h;
            const idx = k2 * W + e2;
            const c = c0 + o.cost;
            if (c < nxt[idx]) {
              nxt[idx] = c; ch[idx] = oi + 1;
              if (e2 === cap) cp[k2] = e;
            }
          }
        }
      }
      let top = 0; for (const o of opts) if (o.h > top) top = o.h;
      maxHpSoFar += top;
      choice.push(ch); capPrev.push(cp);
      const t = cur; cur = nxt; nxt = t;
    }
    // Stigma fixed point. Cost with final level S is the cheapest state with node-HP >= rank - bonus(S), read
    // from the one DP table (suffix minima); the plan is consistent if spending that much unlocks level >= S.
    const suf = new Float64Array(W * KW), arg = new Int32Array(W * KW);
    for (let k = 0; k <= KMAX; k++) {
      let m = INF, a = -1;
      for (let h = cap; h >= 0; h--) { const v = cur[k * W + h]; if (v < m) { m = v; a = h; } suf[k * W + h] = m; arg[k * W + h] = a; }
    }
    const capOf = (S) => Math.max(0, Math.ceil((cfg.rankHp - (STIGMA[S] || 0)) / g));
    const cands = auto ? Array.from({ length: 150 - S0 + 1 }, (_, i) => 150 - i) : [S0];
    const costExact = [], sStar = [], hStart = [];
    for (let k = 0; k <= KMAX; k++) {
      let pick = null;
      for (const S of cands) {
        const cS = Math.min(cap, capOf(S)), c = suf[k * W + cS];
        if (c === INF || c < 0) continue;
        if (!auto || stigmaLevel(spent0 + c) >= S) { pick = { S, c, h: arg[k * W + cS] }; break; }
      }
      if (pick) { costExact.push(pick.c); sStar.push(pick.S); hStart.push(pick.h); } else { costExact.push(INF); sStar.push(S0); hStart.push(-1); }
    }
    function trace(k0) {
      let k = k0, e = hStart[k0]; const plan = [];
      for (let ni = nodes.length - 1; ni >= 0; ni--) {
        const c = choice[ni][k * W + e];
        if (c === 0) continue;          // skipped (state carried over)
        const o = nodeOpts[ni][c - 1];
        const h = Math.round(o.hp / g);
        const prev = e === cap ? capPrev[ni][k] : e - h;
        plan.push({ node: nodes[ni].id, ...o, tag: o.pve ? 'PvE' : 'HP' });
        k -= o.pve; e = prev;
      }
      return plan.reverse();
    }
    const best = [];
    let run = INF, runK = -1;
    for (let k = KMAX; k >= 0; k--) {
      if (costExact[k] < run) { run = costExact[k]; runK = k; }
      best[k] = { slots: k, bestExactSlots: runK, cost: run };
    }
    return { g, cap, target, stigmaHp, KMAX, nodes, nodeOpts, costExact, best, trace, minShare, isEligible, eligibleFor, current, auto, spent0, S0, sStar };
  }


  // ---- DPS objective -------------------------------------------------------------------------------
  // The user supplies a value per stat point (e.g. from the Nipperlug damage calculator); a roll is worth
  // value * weight, a plan is worth the sum over its nodes (expected value for rerolled nodes). Instead of a
  // second DP dimension (too slow) the trade-off "DPS vs. cost" is traced with a Lagrange multiplier:
  //   maximize  DPS - lambda * cost   subject to  total HP >= rank
  // for several lambda. Every run gives one point of the cost/DPS frontier (its convex hull).
  const REBIRTH_MP = 372, MAX_REBIRTHS = 2000;   // Myth Points per rebirth at level 100; the DPS curve stops at 2,000 rebirths
  const dpsFn = (weights) => (o) => (isPvp(o.stat) ? 0 : (weights[baseName(o.stat)] || 0) * o.value);

  // Options of one node for the DPS objective. A rerolled node accepts the rolls with HP >= t and (for the
  // PvE type) a roll value of at least s DPS, so the optimizer can be picky about the stat as well as the level.
  function nodeOptionsDps(node, isEligible, force, curOutcome, dpsOf) {
    const opts = [];
    if (curOutcome) {
      const el = isEligible(curOutcome);
      if (!force || el) opts.push({ hp: curOutcome.hp, cost: 0, pve: el ? 1 : 0, P: 1, expHp: curOutcome.hp, dps: dpsOf(curOutcome), setSize: 1, thr: curOutcome.hp, minDps: 0, keep: true });
    }
    const cand = [];
    const build = (pool, pve, perStat) => {
      const hps = [...new Set(pool.map((o) => o.hp))];
      const ss = perStat ? [...new Set(pool.map(dpsOf))] : [0];
      for (const t of hps) for (const s of ss) {
        let P = 0, eh = 0, ed = 0, mh = Infinity, n = 0;
        for (const o of pool) {
          if (o.hp < t || dpsOf(o) < s - 1e-9) continue;
          P += o.p; eh += o.p * o.hp; ed += o.p * dpsOf(o); n++;
          if (o.hp < mh) mh = o.hp;
        }
        if (P > 0) cand.push({ hp: mh, cost: node.cost / P, pve, P, expHp: eh / P, dps: ed / P, setSize: n, thr: t, minDps: s });
      }
    };
    if (!force) build(node.outcomes, 0, false);
    build(node.outcomes.filter(isEligible), 1, true);
    // drop options that another one beats on HP, DPS and cost at once
    cand.sort((a, b) => a.cost - b.cost || b.hp - a.hp || b.dps - a.dps || b.pve - a.pve);
    const kept = [];
    for (const c of cand) if (!kept.some((k) => k.hp >= c.hp && k.dps >= c.dps - 1e-12)) kept.push(c);
    opts.push(...kept);
    return opts;
  }

  // cfg: like solve() plus weights { [baseStatName]: value per stat point }
  function solveDps(data, cfg) {
    const t0 = Date.now();
    const nodes = prepareNodes(data);
    const auto = cfg.stigmaMode === 'auto';
    const spent0 = auto ? Math.max(0, cfg.spent || 0) : 0;
    const S0 = auto ? stigmaLevel(spent0) : Math.min(150, Math.max(0, cfg.stigma || 0));
    const stigmaHp = STIGMA[S0] || 0;
    const target = Math.max(0, cfg.rankHp - stigmaHp);
    const rules = cfg.nodeRules || {};
    const { eligibleFor, isEligible } = makeEligibility(cfg.allowed, rules, 0);
    const dpsOf = dpsFn(cfg.weights || {});
    const g = gcdAll(nodes, []);
    // the HP axis must reach the highest zone threshold, otherwise nodes of later zones would look locked
    const topReq = ZONES.reduce((m, z) => Math.max(m, z.req), 0);
    const cap = Math.max(Math.ceil(target / g), Math.ceil((topReq - stigmaHp) / g), 0);
    const W = cap + 1;
    const current = currentOutcomes(nodes, cfg.current);
    const nodeOpts = nodes.map((n, i) => nodeOptionsDps(n, eligibleFor(n.id), !!(rules[n.id] && rules[n.id].force), current[i], dpsOf));
    const capOf = (S) => Math.max(0, Math.ceil((cfg.rankHp - (STIGMA[S] || 0)) / g));
    const cands = auto ? Array.from({ length: 150 - S0 + 1 }, (_, i) => 150 - i) : [S0];
    const NEG = -Infinity;
    const maxH = nodeOpts.map((o) => Math.max(0, ...o.map((x) => Math.round(x.hp / g))));

    // one run for a multiplier; with record=true the choices are kept so the plan can be traced back
    function run(lam, record) {
      let cV = new Float64Array(W).fill(NEG), cC = new Float64Array(W), cD = new Float64Array(W);
      let nV = new Float64Array(W), nC = new Float64Array(W), nD = new Float64Array(W);
      cV[0] = 0;
      const choice = [], capPrev = [];
      let maxHp = 0;
      for (let ni = 0; ni < nodes.length; ni++) {
        const node = nodes[ni], full = nodeOpts[ni];
        // per multiplier only options on the (HP, value) frontier matter; the current roll always stays available
        const list = [];
        let keepOpt = null;
        full.forEach((o, i) => { const e = { o, i, h: Math.round(o.hp / g), v: o.dps - lam * o.cost }; if (o.keep) keepOpt = e; else list.push(e); });
        list.sort((a, b) => b.h - a.h || b.v - a.v);
        const opts = [];
        let top = NEG;
        for (const e of list) if (e.v > top) { opts.push(e); top = e.v; }
        if (keepOpt) opts.push(keepOpt);
        const reqU = Math.max(0, Math.ceil((node.zone.req - stigmaHp) / g));
        const forced = !!(rules[node.id] && rules[node.id].force);
        if (forced || current[ni]) nV.fill(NEG); else { nV.set(cV); nC.set(cC); nD.set(cD); }
        const ch = record ? new Uint16Array(W) : null;
        let cp = 0;
        const hi = Math.min(cap, maxHp);
        for (let e = 0; e <= hi; e++) {
          const v0 = cV[e];
          if (v0 === NEG) continue;
          const c0 = cC[e], d0 = cD[e];
          let gateOk = e >= reqU;
          if (!gateOk && auto) gateOk = e * g + stigmaHpAt(spent0 + c0) >= node.zone.req;
          for (let r = 0; r < opts.length; r++) {
            const x = opts[r];
            if (!gateOk && !x.o.keep) continue;
            const e2 = e + x.h > cap ? cap : e + x.h;
            const v2 = v0 + x.v;
            if (v2 > nV[e2]) {
              nV[e2] = v2; nC[e2] = c0 + x.o.cost; nD[e2] = d0 + x.o.dps;
              if (record) { ch[e2] = x.i + 1; if (e2 === cap) cp = e; }
            }
          }
        }
        maxHp += maxH[ni];
        if (record) { choice.push(ch); capPrev.push(cp); }
        let t = cV; cV = nV; nV = t; t = cC; cC = nC; nC = t; t = cD; cD = nD; nD = t;
      }
      // best final state with HP >= what the final Stigma level leaves to the nodes
      const sufArg = new Int32Array(W);
      let bv = NEG, ba = -1;
      for (let e = cap; e >= 0; e--) { if (cV[e] > bv) { bv = cV[e]; ba = e; } sufArg[e] = ba; }
      let pick = null;
      for (const S of cands) {
        const a = sufArg[Math.min(cap, capOf(S))];
        if (a < 0) continue;
        if (!auto || stigmaLevel(spent0 + cC[a]) >= S) { pick = { lam, S, e: a, cost: cC[a], dps: cD[a] }; break; }
      }
      if (!pick) return null;
      if (record) {
        const plan = [];
        let e = pick.e;
        for (let ni = nodes.length - 1; ni >= 0; ni--) {
          const c = choice[ni][e];
          if (c === 0) continue;
          const o = nodeOpts[ni][c - 1];
          const prev = e === cap ? capPrev[ni] : e - Math.round(o.hp / g);
          plan.push({ node: nodes[ni].id, oi: c - 1 });
          e = prev;
        }
        pick.plan = plan.reverse();
      }
      return pick;
    }

    const common = { dpsMode: true, g, cap, target, stigmaHp, nodes, nodeOpts, minShare: 0, isEligible, eligibleFor, current, auto, spent0, S0, dpsOf };
    // endpoints: the cheapest plan (huge multiplier) and the plan with the most DPS (tiny multiplier)
    const A = run(1e9, true), B = run(1e-9, true);
    if (!A || !B) {
      return { ...common, KMAX: 0, costExact: [Infinity], best: [{ slots: 0, bestExactSlots: 0, cost: Infinity, dps: 0 }], levels: [0], sStar: [S0], trace: () => [] };
    }
    // The most DPS needs absurd amounts of Myth Points; the curve stops at MAX_REBIRTHS (or 1.5 times the cheapest plan).
    const costCap = Math.max(MAX_REBIRTHS * REBIRTH_MP, A.cost * 1.5);
    const STEPS = 50, MAX_STATES = +cfg.maxStates || 3000;
    let pts = [A, B];
    // 1) Lagrange hull: between two neighbours the multiplier that makes both equally good either finds a point above
    //    the connecting line (new hull point) or proves the segment is an edge
    const segs = [[A, B]];
    let evals = 2;
    while (B.dps - A.dps > 1e-9 && evals < 40) {
      const open = segs.filter((s) => s[0].cost < costCap);
      if (!open.length) break;
      open.sort((a, b) => (b[1].dps - b[0].dps) - (a[1].dps - a[0].dps));
      const [P, Q] = open[0];
      const rangeCap = Math.max(...pts.filter((p) => p.cost <= costCap).map((p) => p.dps)) - A.dps;
      if (Q.dps - P.dps < rangeCap / STEPS / 2) break;
      segs.splice(segs.indexOf(open[0]), 1);
      if (!(Q.cost - P.cost > 1e-9)) continue;
      const lam = (Q.dps - P.dps) / (Q.cost - P.cost);
      const R = run(lam, true); evals++;
      if (!R) continue;
      const vP = P.dps - lam * P.cost, vR = R.dps - lam * R.cost;
      if (vR > vP + 1e-7 * Math.abs(vP) + 1e-9 && R.cost > P.cost + 1e-9 && R.cost < Q.cost - 1e-9) { pts.push(R); segs.push([P, R], [R, Q]); }
    }
    // The slot solver's cheapest plan is what the UI calls the cheapest path in both modes. The exact search can find a plan
    // up to ~1 % cheaper (it tracks the Stigma gates exactly), so the curve starts at the slot solver's value for consistency.
    const slotCheapest = solve(data, { ...cfg, maxSlots: 0 }).costExact[0];
    const floor = isFinite(slotCheapest) ? slotCheapest - 1e-6 : 0;
    const frontier = (list) => {
      const kept = list.filter((p) => p.cost >= floor);
      list = (kept.length ? kept : list).filter((p) => p.cost <= costCap).sort((a, b) => a.cost - b.cost || b.dps - a.dps);
      const out = [];
      for (const p of list) if (!out.length || p.dps > out[out.length - 1].dps + 1e-9) out.push(p);
      return out;
    };
    const hull = frontier(pts);
    const tHull = Date.now() - t0;

    // 2) Gap filling. The hull only holds the points a multiplier can reach; between two neighbours there are better
    //    plans (the frontier is not convex). Neighbouring hull plans differ in few nodes, so an exact search over the
    //    options they use (all nodes, exact HP/cost/DPS, no rounding) finds them.
    const hpCap = Math.max(target, topReq - stigmaHp);
    const finalS = (c) => (auto ? stigmaLevel(spent0 + c) : S0);
    const dq = (hull[hull.length - 1].dps - hull[0].dps) / 4000 || 1;
    const prune = (states) => {     // keep the states no other state beats on HP, DPS and cost at once
      states.sort((a, b) => b.h - a.h || b.d - a.d || a.c - b.c);
      const front = [], out = [];
      for (const st of states) {
        let lo = 0, hi = front.length;
        while (lo < hi) { const m = (lo + hi) >> 1; if (front[m].c <= st.c) lo = m + 1; else hi = m; }
        if (lo > 0 && front[lo - 1].d >= st.d) continue;
        let j = lo;
        while (j < front.length && front[j].d <= st.d) j++;
        front.splice(lo, j - lo, st); out.push(st);
      }
      return out;
    };
    // safety net for big windows: one state per (HP, DPS) cell; the cells start tiny and grow until few enough states remain
    const thin = (states) => {
      for (let m = 1; ; m *= 2) {
        const cell = new Map();
        for (const st of states) { const k = Math.floor(st.h / m) * 100000 + Math.floor(st.d / (dq * m)); const o = cell.get(k); if (!o || st.c < o.c) cell.set(k, st); }
        if (cell.size <= MAX_STATES || m > 4096) return [...cell.values()];
      }
    };
    const fill = (plans) => {
      const allowedOpts = nodes.map(() => new Set());
      for (const pl of plans) {
        const seen = new Set();
        for (const x of pl) { allowedOpts[x.node - 1].add(x.oi); seen.add(x.node); }
        for (let n = 1; n <= nodes.length; n++) if (!seen.has(n)) allowedOpts[n - 1].add(-1);
      }
      // all options between the cheapest and the dearest one the plans use (in the node's cost order)
      for (let ni = 0; ni < nodes.length; ni++) {
        const used = [...allowedOpts[ni]].filter((oi) => oi >= 0);
        if (used.length < 2) continue;
        for (let oi = Math.min(...used); oi <= Math.max(...used); oi++) allowedOpts[ni].add(oi);
      }
      let states = [{ c: 0, d: 0, h: 0, par: null, node: 0, oi: -1 }];
      for (let ni = 0; ni < nodes.length; ni++) {
        const al = [...allowedOpts[ni]], opts = nodeOpts[ni], req = nodes[ni].zone.req;
        const next = [];
        for (const st of states) {
          const gate = st.h + stigmaHp >= req || (auto && st.h + stigmaHpAt(spent0 + st.c) >= req);
          for (const oi of al) {
            if (oi === -1) { next.push({ c: st.c, d: st.d, h: st.h, par: st, node: ni + 1, oi: -1 }); continue; }
            const o = opts[oi];
            if (!gate && !o.keep) continue;
            const c = st.c + o.cost;
            if (c > costCap) continue;
            next.push({ c, d: st.d + o.dps, h: Math.min(hpCap, st.h + o.hp), par: st, node: ni + 1, oi });
          }
        }
        states = al.length > 1 ? prune(next) : next;
        if (states.length > MAX_STATES) states = prune(thin(states));
      }
      return states.filter((st) => st.h + (STIGMA[finalS(st.c)] || 0) >= cfg.rankHp);
    };
    const planOfState = (st) => { const pl = []; for (let x = st; x && x.node; x = x.par) if (x.oi >= 0) pl.push({ node: x.node, oi: x.oi }); return pl.reverse(); };
    // Repeat with the new points as plans (they use options the hull plans do not) until the curve stops improving.
    const planOf = (p) => p.plan || (p.plan = planOfState(p.state));
    const stepDps = (hull[hull.length - 1].dps - hull[0].dps) / STEPS;
    const costAt = (list, lv) => { const p = list.find((x) => x.dps >= lv - 1e-9); return p ? p.cost : Infinity; };
    let cur = hull;
    for (let pass = 0; pass < 2; pass++) {
      const add = [];
      for (let j = 0; j + 1 < cur.length; j++) {
        if (cur[j + 1].dps - cur[j].dps < stepDps / 8) continue;   // finer than the slider can show
        for (const st of fill(cur.slice(Math.max(0, j - 1), j + 3).map(planOf))) add.push({ cost: st.c, dps: st.d, state: st });
      }
      const merged = frontier(cur.concat(add));
      let gain = 0;
      for (let k = 0; k <= STEPS; k++) {
        const lv = hull[0].dps + stepDps * k, a0 = costAt(cur, lv), a1 = costAt(merged, lv);
        if (isFinite(a0) && isFinite(a1)) gain = Math.max(gain, a0 / a1 - 1);
      }
      cur = merged;
      if (gain < 0.002) break;
    }
    const pts2 = cur.map((p) => ({ cost: p.cost, dps: p.dps, S: finalS(p.cost), plan: planOf(p) }));

    const range = pts2[pts2.length - 1].dps - pts2[0].dps;
    const K = range > 1e-9 ? STEPS : 0;
    // slider levels: the DPS range split in steps; each level costs what the cheapest plan reaching it costs
    const levels = [], best = [];
    for (let k = 0; k <= K; k++) {
      const lv = K ? pts2[0].dps + (range * k) / K : pts2[0].dps;
      levels.push(lv);
      let j = pts2.findIndex((p) => p.dps >= lv - 1e-9 * Math.max(1, range));
      if (j < 0) j = pts2.length - 1;
      best.push({ slots: k, bestExactSlots: j, cost: pts2[j].cost, dps: pts2[j].dps });
    }
    return { ...common, cheapest: isFinite(slotCheapest) ? slotCheapest : null, KMAX: K, costExact: pts2.map((p) => p.cost), best, levels, sStar: pts2.map((p) => p.S), evals,
      points: pts2.map((p) => ({ cost: p.cost, dps: p.dps, S: p.S })), timing: { hull: tHull, total: Date.now() - t0 },
      trace: (j) => pts2[j].plan.map(({ node, oi }) => { const o = nodeOpts[node - 1][oi]; return { node, ...o, oi, tag: o.pve ? 'PvE' : 'HP' }; }) };
  }

  // Reproduces the planner's "Max PvE" preset: per node the stat with the highest max-level HP worth
  // (ties: offensive/modifier before defensive, PvE variant first), at its top level.
  function maxPveReference(data, catOf) {
    const nodes = prepareNodes(data);
    let cost = 0, hp = 0; const rows = [];
    for (const n of nodes) {
      const byStat = {};
      for (const o of n.outcomes) if (!byStat[o.stat] || o.level > byStat[o.stat].level) byStat[o.stat] = o;
      let best = null, bk = null;
      for (const o of Object.values(byStat)) {
        const c = catOf(o.stat);
        const k = [-o.hp, c === 'offensive' || c === 'modifier' ? 0 : c === 'defensive' ? 1 : 2,
          /^Pve /.test(o.stat) ? 0 : /^Pvp /.test(o.stat) ? 2 : 1];
        if (!bk || k[0] < bk[0] || (k[0] === bk[0] && (k[1] < bk[1] || (k[1] === bk[1] && k[2] < bk[2])))) { bk = k; best = o; }
      }
      cost += n.cost / best.p; hp += best.hp;
      rows.push({ node: n.id, stat: best.stat, level: best.level, value: best.value, hp: best.hp, p: best.p });
    }
    return { cost, hp, rows };
  }

  // "After the goal" view. For every PvE node: the best way to improve it, i.e. reroll until a PvE roll with at
  // least HP value t lands. Per node the threshold with the highest average HP gain per expected Myth Point wins;
  // the nodes are then ranked by that efficiency.
  // cfg: { allowed:Set<baseName>, nodeRules, current, scope: 'pve' | 'all', weights? }
  // With weights (DPS per stat point) the thresholds and the ranking use DPS instead of HP.
  //   'pve' = nodes that carry a PvE roll now (or are forced to be PvE); 'all' = every node that can roll a PvE stat
  function upgradeCandidates(data, cfg) {
    const nodes = prepareNodes(data);
    const rules = cfg.nodeRules || {};
    const { eligibleFor } = makeEligibility(cfg.allowed, rules, 0);
    const current = currentOutcomes(nodes, cfg.current);
    const dpsOf = cfg.weights ? dpsFn(cfg.weights) : null;   // set: rank by DPS gain per Myth Point instead of HP
    const rows = [];
    nodes.forEach((node, i) => {

      const pveNow = !!(cur && isEl(cur)), forced = !!(rules[node.id] && rules[node.id].force);
      if (cfg.scope !== 'all' && !pveNow && !forced) return;

      const curHp = cur ? cur.hp : 0;
      const maxLevel = (stat) => Math.max(...node.outcomes.filter((x) => x.stat === stat).map((x) => x.level));
      let best = null;
      const options = [];
      // HP objective: stop at rolls worth at least `thr` HP; DPS objective: stop at rolls worth at least `thr` DPS
      const val = dpsOf || ((o) => o.hp), curVal = cur ? val(cur) : 0;
      for (const thr of [...new Set(elig.map(val))].filter((v) => v > curVal + 1e-9).sort((a, b) => a - b)) {
        const set = elig.filter((o) => val(o) >= thr - 1e-9);
        const P = set.reduce((sum, o) => sum + o.p, 0);
        if (P <= 0) continue;
        const expHp = set.reduce((sum, o) => sum + o.p * o.hp, 0) / P;
        const expDps = dpsOf ? set.reduce((sum, o) => sum + o.p * dpsOf(o), 0) / P : 0;
        const byStat = {};
        for (const o of set) {
          const b = byStat[o.stat] || (byStat[o.stat] = { stat: o.stat, minLevel: 99, maxLevel: maxLevel(o.stat), minValue: Infinity, p: 0 });
          b.minLevel = Math.min(b.minLevel, o.level); b.minValue = Math.min(b.minValue, o.value); b.p += o.p;
        }
        const minHp = Math.min(...set.map((o) => o.hp));
        const opt = { thr, P, cost: node.cost / P, expHp, gainMin: minHp - curHp, gainExp: expHp - curHp,
          dps: expDps, gainDps: expDps - curVal, accepts: Object.values(byStat).sort((a, b) => b.p - a.p) };
        opt.eff = (dpsOf ? opt.gainDps : opt.gainExp) / opt.cost;
        options.push(opt);
        if (!best || opt.eff > best.eff) best = opt;
      }
      if (!best) return;   // already at the best roll
      rows.push({ node: node.id, zone: ZONES.indexOf(node.zone) + 1, rerollCost: node.cost, pveNow, forced, best, options,
        cur: cur ? { stat: cur.stat, level: cur.level, value: cur.value, hp: cur.hp, dps: dpsOf ? dpsOf(cur) : 0, maxLevel: maxLevel(cur.stat) } : null });
    });
    rows.sort((a, b) => b.best.eff - a.best.eff || a.node - b.node);
    return rows;
  }

  // describe which outcomes a chosen option accepts (for display)
  function describeOption(node, opt, isEligible) {
    const set = node.outcomes.filter((o) => o.hp >= opt.thr && (opt.pve ? isEligible(o) : true));
    return set;
  }

  const api = { ZONES, RANKS, NODE_COST, STIGMA, CORE_PVE, SECONDARY_PVE, baseName, isPvp, prepareNodes, solve, solveDps, dpsFn, describeOption, maxPveReference, upgradeCandidates, rankBonus, stigmaLevel, stigmaSpentFor, STIGMA_COST, STIGMA_CUM };
