  const $ = (id) => document.getElementById(id);

  // ---- language ----------------------------------------------------------------------------------
  const LOCALES = { en: 'en-US', de: 'de-DE' };
  const LANG_KEY = 'mythopt.lang';
  let lang = 'en';
  try { const l = localStorage.getItem(LANG_KEY); if (l === 'en' || l === 'de') lang = l; } catch (e) { /* storage unavailable */ }
  // An explicit ?lang= in the address wins over the stored choice, so a link
  // can decide which language the tool opens in.
  try {
    const q = new URLSearchParams(location.search).get('lang');
    if (q === 'en' || q === 'de') lang = q;
  } catch (e) { /* no URL API */ }
  const t = (key, p) => {
    const v = I18N[lang][key] !== undefined ? I18N[lang][key] : I18N.en[key];
    return typeof v === 'function' ? v(p || {}) : v;
  };
  const fmt = (n, d = 0) => Number(n).toLocaleString(LOCALES[lang], { maximumFractionDigits: d, minimumFractionDigits: d });
  const pctN = (v, d = 1) => fmt(v, d) + (lang === 'de' ? ' %' : '%');   // v is already in percent
  const pct = (x, d = 1) => pctN(x * 100, d);                            // x is a fraction

  const camel = (n) => { const p = n.split(' '); return p[0].toLowerCase() + p.slice(1).map((x) => x[0].toUpperCase() + x.slice(1)).join(''); };
  const catOf = (name) => { const k = camel(E.baseName(name)); return CATS[k] ? CATS[k][1] : '?'; };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---- stat list ---------------------------------------------------------------------------------
  const baseStats = [...new Set(DATA.flatMap((n) => n.stats.map((s) => s.name)).filter((n) => !E.isPvp(n)).map(E.baseName))].sort();
  const GROUP_KEYS = ['groupCore', 'groupSecondary', 'groupOffense', 'groupOther'];
  const groupOf = (b) => E.CORE_PVE.includes(b) ? 0 : E.SECONDARY_PVE.includes(b) ? 1
    : ['offensive', 'modifier'].includes(catOf(b)) ? 2 : 3;
  let allowed = new Set(E.CORE_PVE);

  const state = {
    mode: 'goal', upAll: false, up: null, rankId: 'angelus', stigma: 0, stigmaMode: 'auto', stLevel: 1, stProgress: 0, allRoll: false,
    budget: 0, budgetTouched: false, nodeRules: {}, current: {}, sort: 'eff', selNode: null, slots: 0, point: null,
    solved: null, plan: null, status: null, token: 0, planToken: 0,
    weights: {}, lastDps: false, upDps: false,
  };

  // optional DPS values { [base stat]: DPS per point }; any positive value switches the objective from PvE slots to DPS
  const NO_DPS = ['Accuracy', 'Attack Rate', 'Ignore Evasion'];   // never add damage, so no value is asked for
  const OFFENSIVE = baseStats.filter((b) => statGroup(b) === 'offensive' && !NO_DPS.includes(b))
    .sort((a, b) => (E.CORE_PVE.includes(b) - E.CORE_PVE.includes(a)) || a.localeCompare(b));
  const weightsOn = () => OFFENSIVE.some((b) => state.weights[b] > 0);
  const activeWeights = () => Object.fromEntries(OFFENSIVE.filter((b) => state.weights[b] > 0).map((b) => [b, state.weights[b]]));
  const pveSet = () => (weightsOn() ? new Set(Object.keys(activeWeights())) : allowed);
  const dpsOfRoll = (stat, value) => (E.isPvp(stat) ? 0 : (state.weights[E.baseName(stat)] || 0) * value);
  const signed = (n, d = 0) => (n < 0 ? '−' : '+') + fmt(Math.abs(n), d);
  const fmtEff = (x) => fmt(x, Math.abs(x) < 1 ? 3 : 2);

  // ---- persistence (best effort; the page also works without storage) ----------------------------
  const LS_KEY = 'mythopt.v2';
  const validRoll = (id, c) => !!(c && DATA[id - 1] && DATA[id - 1].stats.some((x) => x.name === c.stat && x.levels.some((l) => l.level === c.level)));
  try {
    const o = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (o) {
      if (E.RANKS.some((r) => r.id === o.rankId)) state.rankId = o.rankId;
      state.stigma = Math.max(0, Math.min(150, parseInt(o.stigma, 10) || 0));
      if (o.stigmaMode === 'manual' || o.stigmaMode === 'auto') state.stigmaMode = o.stigmaMode;
      if (o.mode === 'goal' || o.mode === 'upgrade') state.mode = o.mode;
      state.upAll = !!o.upAll;
      state.stLevel = Math.min(150, Math.max(1, parseInt(o.stLevel, 10) || 1));
      state.stProgress = Math.max(0, parseInt(o.stProgress, 10) || 0);
      if (Array.isArray(o.allowed)) allowed = new Set(o.allowed);
      state.nodeRules = o.nodeRules || {};
      if (o.weights && typeof o.weights === 'object') for (const b of OFFENSIVE) { const v = parseFloat(o.weights[b]); if (v > 0 && isFinite(v)) state.weights[b] = v; }
      for (const [id, c] of Object.entries(o.current || {})) if (validRoll(+id, c)) state.current[id] = { stat: c.stat, level: c.level };
    }
  } catch (e) { /* storage unavailable */ }
  const spentNow = () => E.stigmaSpentFor(state.stLevel, state.stProgress);
  const saveState = () => {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({
        mode: state.mode, upAll: state.upAll, rankId: state.rankId, stigma: state.stigma, stigmaMode: state.stigmaMode, stLevel: state.stLevel,
        stProgress: state.stProgress, allowed: [...allowed], nodeRules: state.nodeRules, current: state.current, weights: state.weights,
      }));
    } catch (e) { /* ignore */ }
  };
  const rollOf = (id) => {
    const c = state.current[id]; if (!c) return null;
    const st = DATA[id - 1].stats.find((x) => x.name === c.stat), l = st.levels.find((x) => x.level === c.level);
    return { stat: c.stat, level: c.level, value: l.value, hp: l.holyPower + E.ZONES.find((z) => id >= z.from && id <= z.to).bonus, maxLevel: Math.max(...st.levels.map((x) => x.level)) };
  };
  const stigmaHpNow = () => (state.stigmaMode === 'auto' ? E.STIGMA[E.stigmaLevel(spentNow())] : (E.STIGMA[state.stigma] || 0));
  const curStats = () => { let n = 0, hp = 0; for (const id of Object.keys(state.current)) { n++; hp += rollOf(+id).hp; } return { n, hp }; };

  // ---- status line -------------------------------------------------------------------------------
  function setStatus(kind, params) { state.status = { kind, params }; renderStatus(); }
  function renderStatus() {
    const s = state.status, el = $('status'); if (!s) return;
    if (s.kind === 'calc') el.innerHTML = `<span class="spin"></span>${t('statusCalc')}`;
    else if (s.kind === 'done') el.textContent = s.params.dps != null ? t('statusDoneDps', { ms: fmt(s.params.ms), dps: fmt(s.params.dps) }) : t('statusDone', { ms: fmt(s.params.ms), k: s.params.k });
    else if (s.kind === 'unreachable') el.innerHTML = t('statusUnreachable');
    else if (s.kind === 'error') el.textContent = t('errorPrefix') + s.params.message;
    else if (s.kind === 'up') el.textContent = t('upStatus', { n: s.params.n });
  }

  // ---- worker ------------------------------------------------------------------------------------
  const worker = new Worker(URL.createObjectURL(new Blob([WORKER_SRC], { type: 'text/javascript' })));
  worker.postMessage({ type: 'init', data: DATA });
  worker.onmessage = (ev) => {
    const m = ev.data;
    if (m.type === 'error') { setStatus('error', { message: m.message }); return; }
    if (m.type === 'solved' && m.id === state.token) onSolved(m);
    if (m.type === 'plan' && m.id === state.planToken) { state.plan = m; if (state.mode === 'goal') renderPlan(); }
  };

  let solveTimer = null;
  function scheduleSolve() {
    clearTimeout(solveTimer);
    saveState();
    setStatus('calc');
    solveTimer = setTimeout(() => {
      const rank = E.RANKS.find((r) => r.id === state.rankId);
      state.token++;
      worker.postMessage({
        type: 'solve', id: state.token, rankHp: rank.hp, stigma: state.stigma, stigmaMode: state.stigmaMode, spent: spentNow(),
        allowed: [...pveSet()], weights: weightsOn() ? activeWeights() : null, minShare: 0, nodeRules: state.nodeRules, current: state.current,
      });
    }, 250);
  }
  // an input changed: re-solve (goal mode) or rebuild the upgrade list (upgrade mode)
  function changed() { saveState(); renderStats(); if (state.mode === 'goal') scheduleSolve(); else renderUpgradeView(); }
  function requestPlan() {
    if (!state.solved) return;
    state.planToken++;
    worker.postMessage({ type: 'plan', id: state.planToken, slots: state.slots, point: state.point });
  }

  function onSolved(m) {
    state.solved = m;
    if (m.dpsMode !== state.lastDps) { state.lastDps = m.dpsMode; state.budgetTouched = false; }   // the curve means something else now
    refreshModeTexts();
    if (state.mode !== 'goal') return;   // the upgrade view does not use the solver
    if (!isFinite(m.best[0].cost)) {
      $('cards').innerHTML = ''; $('chart').innerHTML = ''; $('plansec').hidden = true;
      setStatus('unreachable');
      renderEditor(); return;
    }
    setStatus('done', { ms: m.ms, k: m.KMAX, dps: m.dpsMode ? m.levels[m.KMAX] : null });
    if (!state.budgetTouched) { state.budget = Math.max(1, Math.ceil(m.best[m.KMAX].cost / MP_PER_REBIRTH)); $('budget').value = state.budget; }
    const pk = pickByBudget();
    state.slots = pk.k; state.point = pk.point;
    $('slots').max = m.KMAX; $('slots').value = state.slots;
    renderAll();
    requestPlan();
  }

  // The budget picks the plan. DPS mode: the best exact plan of the curve within the budget (the slider only shows
  // roughly where it is); slot mode: the highest slot count within the budget.
  function pickByBudget() {
    const s = state.solved; if (!s) return { k: 0, point: null };
    const lim = state.budget * MP_PER_REBIRTH + 1e-9;
    if (s.dpsMode) {
      let j = 0; for (let i = 0; i < s.points.cost.length; i++) if (s.points.cost[i] <= lim) j = i;
      let k = 0; for (let i = 0; i <= s.KMAX; i++) if (s.levels[i] <= s.points.dps[j] + 1e-9) k = i;
      return { k, point: j };
    }
    let k = 0; for (let i = 0; i <= s.KMAX; i++) if (s.best[i].cost <= lim) k = i;
    return { k, point: null };
  }
  // the "cheapest path" is the slot solver's value in both modes, so the card does not change when DPS values are entered
  const cheapestOf = (s) => (s.cheapest != null ? s.cheapest : s.best[0].cost);
  const selIndex = () => { const s = state.solved; return s.dpsMode && state.point != null ? state.point : s.best[state.slots].bestExactSlots; };
  const sel = () => {
    const s = state.solved, j = selIndex();
    return s.dpsMode ? { j, cost: s.points.cost[j], dps: s.points.dps[j] } : { j, cost: s.best[state.slots].cost, dps: 0 };
  };

  // ---- rendering ---------------------------------------------------------------------------------
  const maxPve = E.maxPveReference(DATA, catOf);

  function renderAll() { renderCards(); renderChart(); }

  const finalStigma = () => {
    const s = state.solved;
    return s && s.sStar && isFinite(sel().cost) ? s.sStar[selIndex()] : null;
  };
  function updateStInfo() {
    const el = $('stinfo'); if (!el) return;
    if (state.stigmaMode !== 'auto') { el.textContent = ''; return; }
    const sp = spentNow(), lv = E.stigmaLevel(sp);
    let s = t('stNow', { lv, hp: fmt(E.STIGMA[lv]) });
    if (lv < 150) s += t('stNext', { next: lv + 1, mp: fmt(E.STIGMA_COST[lv] - (sp - E.STIGMA_CUM[lv])) });
    const after = finalStigma();
    if (after != null) s += t('stAfter', { s: after, hp: fmt(E.STIGMA[after]) });
    el.textContent = s;
  }

  function renderCards() {
    const s = state.solved; if (!s) return;
    const base = cheapestOf(s), cur = sel().cost;
    const rank = E.RANKS.find((r) => r.id === state.rankId);
    const has = curStats().n > 0, auto = state.stigmaMode === 'auto';
    const after = finalStigma();
    const dm = s.dpsMode, k = state.slots;
    // third card: PvE slots -> Myth Points per extra slot; DPS -> Myth Points per extra DPS
    let third;
    if (dm) {
      const cd = sel().dps;
      let nx = 0; while (nx <= s.KMAX && s.best[nx].dps <= cd + 1e-9) nx++;
      const gain = cd - s.points.dps[0];
      third = `<div class="card"><div class="k">${t('cardPerDpsTitle')}</div>
        <div class="v">${gain > 0 ? fmt((cur - base) / gain, 1) : '–'} <small>MP</small></div>
        <div class="s">${nx <= s.KMAX ? t('cardNextDps', { dps: fmt(s.best[nx].dps), mp: fmt(s.best[nx].cost - cur) }) : t('cardMaxReached')}</div></div>`;
    } else {
      third = `<div class="card"><div class="k">${t('cardPerSlotTitle')}</div>
        <div class="v">${k ? fmt((cur - base) / k) : '–'} <small>MP</small></div>
        <div class="s">${k < s.KMAX ? t('cardNextSlot', { mp: fmt(s.best[k + 1].cost - cur) }) : t('cardMaxReached')}</div></div>`;
    }
    $('cards').innerHTML = `
      <div class="card"><div class="k">${t('cardCheapTitle', { has, rank: rank.name })}</div>
        <div class="v">${fmt(base)} <small>MP</small></div><div class="s">${t('cardCheapSub', { has, auto, rank: rank.name, reb: fmt(base / MP_PER_REBIRTH, 1) })}</div></div>
      <div class="card hi"><div class="k">${dm ? t('cardSelTitleDps', { has, dps: fmt(sel().dps) }) : t('cardSelTitle', { has, slots: k })}</div>
        <div class="v">${fmt(cur)} <small>MP</small></div>
        <div class="s">${t('cardSelSub', { has, reb: fmt(cur / MP_PER_REBIRTH, 1), stigmaAfter: auto ? after : null, overBudget: base > state.budget * MP_PER_REBIRTH })}</div></div>
      ${third}
      <div class="card"><div class="k">${t('cardMaxPveTitle')}</div>
        <div class="v">${t('cardMaxPveValue', { m: fmt(maxPve.cost / 1e6, 1) })}</div>
        <div class="s">${t('cardMaxPveSub', { k: fmt(maxPve.cost / MP_PER_REBIRTH / 1000, 0) })}</div></div>`;
    updateStInfo();
  }

  function renderChart() {
    const s = state.solved; if (!s) return;
    const W = 860, H = 300, L = 62, R = 14, T = 12, B = 34;
    const dm = s.dpsMode;
    // DPS mode draws every plan of the curve at its DPS; slot mode one point per slot count
    const kOfDps = (d) => (s.levels[s.KMAX] > s.levels[0] ? Math.max(0, Math.min(s.KMAX, ((d - s.levels[0]) / (s.levels[s.KMAX] - s.levels[0])) * s.KMAX)) : 0);
    const pts = [];
    if (dm) { for (let j = 0; j < s.points.cost.length; j++) if (s.points.dps[j] <= s.levels[s.KMAX] + 1e-9) pts.push([kOfDps(s.points.dps[j]), s.points.cost[j]]); }
    else for (let k = 0; k <= s.KMAX; k++) if (isFinite(s.best[k].cost)) pts.push([k, s.best[k].cost]);
    const x = (k) => L + (s.KMAX ? (k / s.KMAX) * (W - L - R) : 0);
    const lo = Math.log(pts[0][1] * 0.98), hi = Math.log(pts[pts.length - 1][1] * 1.04);
    const y = (c) => T + (1 - (Math.log(c) - lo) / (hi - lo || 1)) * (H - T - B);
    let g = '';
    const ticks = [];
    { const a = Math.exp(lo), b = Math.exp(hi), e0 = Math.floor(Math.log10(a)), e1 = Math.ceil(Math.log10(b));
      for (let e = e0; e <= e1; e++) for (const m of [1, 2, 5]) { const v = m * 10 ** e; if (v >= a && v <= b) ticks.push(v); } }
    for (const tk of ticks) g += `<line x1="${L}" x2="${W - R}" y1="${y(tk)}" y2="${y(tk)}" stroke="var(--line)"/><text x="${L - 8}" y="${y(tk) + 4}" text-anchor="end">${fmt(tk)}</text>`;
    const step = dm ? 10 : s.KMAX > 30 ? 5 : s.KMAX > 14 ? 2 : 1;
    for (let k = 0; k <= s.KMAX; k += step) g += `<text x="${x(k)}" y="${H - 14}" text-anchor="middle">${dm ? fmt(s.levels[k]) : k}</text>`;
    g += `<text x="${(L + W - R) / 2}" y="${H - 1}" text-anchor="middle">${t(dm ? 'chartAxisDps' : 'chartAxis')}</text>`;
    const base = cheapestOf(s);
    g += `<line x1="${L}" x2="${W - R}" y1="${y(base)}" y2="${y(base)}" stroke="var(--hp)" stroke-dasharray="4 4" opacity=".7"/>`;
    const bud = state.budget * MP_PER_REBIRTH;
    if (bud >= Math.exp(lo) && bud <= Math.exp(hi)) g += `<line x1="${L}" x2="${W - R}" y1="${y(bud)}" y2="${y(bud)}" stroke="var(--gold)" stroke-dasharray="2 5" opacity=".6"/>`;
    g += `<path d="${pts.map((p, i) => (i ? 'L' : 'M') + x(p[0]).toFixed(1) + ' ' + y(p[1]).toFixed(1)).join('')}" fill="none" stroke="var(--pve)" stroke-width="2"/>`;
    if (!dm && s.KMAX <= 60) for (const p of pts) g += `<circle cx="${x(p[0])}" cy="${y(p[1])}" r="2.5" fill="var(--pve)"/>`;
    const sc = sel().cost, sk = dm ? kOfDps(sel().dps) : state.slots;
    g += `<line x1="${x(sk)}" x2="${x(sk)}" y1="${T}" y2="${H - B}" stroke="var(--gold)" opacity=".5"/><circle cx="${x(sk)}" cy="${y(sc)}" r="6" fill="var(--gold)" stroke="var(--bg)" stroke-width="2"/>`;
    $('chart').innerHTML = `<svg class="chart" id="svg" viewBox="0 0 ${W} ${H}">${g}</svg>`;
    const svg = $('svg');
    const kAt = (ev) => { const r = svg.getBoundingClientRect(); const px = ((ev.clientX - r.left) / r.width) * W; return Math.max(0, Math.min(s.KMAX, Math.round(((px - L) / (W - L - R)) * s.KMAX))); };
    svg.addEventListener('pointermove', (ev) => {
      const k = kAt(ev), c = s.best[k].cost;
      const p = { k, dps: fmt(s.best[k].dps), cost: fmt(c), upPct: pctN((c / base - 1) * 100, 1), reb: fmt(c / MP_PER_REBIRTH, 1) };
      $('tip').textContent = t(dm ? 'chartTipDps' : 'chartTip', p);
    });
    svg.addEventListener('pointerleave', () => { $('tip').textContent = tipDefault(); });
    svg.addEventListener('click', (ev) => setSlots(kAt(ev)));
  }

  const currentLine = (r) => (r.cur ? `<br><i class="m">${t('currentLine', { stat: esc(r.cur.stat), lv: r.cur.level, hp: fmt(r.cur.hp) })}</i>` : '');
  const statLine = (r) => {
    if (r.keep) { const c = r.stats[0]; return `<span class="acc">${t('keepLine', { stat: esc(c.stat), lv: c.minLevel, max: c.maxLevel, value: fmt(c.minValue) })}</span>`; }
    if (!r.pve) return `<span class="acc">${t('anyRoll', { hp: fmt(r.hp) })}</span>` + currentLine(r);
    return r.stats.map((s) => `<span class="acc">${esc(s.stat)} <i>≥ ${fmt(s.minValue)} (Lv ${s.minLevel}+)</i></span>`).join('<br>') + currentLine(r);
  };
  // HP gained over the current state and the resulting HP per expected Myth Point
  const gainOf = (r) => (r.keep ? 0 : r.hp - (r.cur ? r.cur.hp : 0));
  const effOf = (r) => (r.keep || r.cost <= 0 ? -Infinity : gainOf(r) / r.cost);
  // DPS objective: the same per node, in expected DPS
  const dpsGainOf = (r) => (r.keep ? 0 : r.dps - (r.cur ? r.cur.dps : 0));
  const dpsEffOf = (r) => (r.keep || r.cost <= 0 ? -Infinity : dpsGainOf(r) / r.cost);
  const planDps = () => !!(state.plan && state.plan.dpsMode);
  const primEff = (r) => (planDps() ? dpsEffOf(r) : effOf(r));
  const sortKey = (r) => (r.keep ? -1e6 + (r.upgrade ? r.upgrade.eff : 0) : primEff(r));
  const sortedRows = (rows) => {
    const out = rows.slice();
    if (state.sort === 'eff') out.sort((a, b) => (sortKey(b) - sortKey(a)) || a.node - b.node);
    return out;
  };
  const nodeLink = (id) => `<a href="#" class="nodelink" data-node="${id}" title="${esc(t('nodeLinkTip'))}">#${id}</a>`;

  function renderPlan() {
    const p = state.plan, s = state.solved; if (!p || !s) return;
    const rows = sortedRows(p.rows);
    const nKeep = rows.filter((r) => r.keep).length;
    const byEff = state.sort === 'eff';
    const nPve = rows.filter((r) => r.pve).length;
    const dm = !!p.dpsMode, cols = dm ? 8 : 7;
    let html = '', zone = 0, hp = 0, cost = 0, rolls = 0, gain = 0, dps = 0, dpsGain = 0;
    for (const r of rows) {
      if (!byEff && r.zone !== zone) {
        zone = r.zone;
        html += `<tr class="zone"><td colspan="${cols}">${t('zoneRow', { zone, req: fmt(E.ZONES[zone - 1].req), bonus: E.ZONES[zone - 1].bonus })}</td></tr>`;
      }
      hp += r.hp; cost += r.cost; gain += gainOf(r); dps += r.dps; dpsGain += dpsGainOf(r);
      if (!r.keep) rolls += r.expRolls;
      const g = gainOf(r);
      const tag = r.keep ? t('tagStays') : r.pve ? 'PvE' : 'HP';
      const effCell = r.keep
        ? (r.upgrade
          ? `<span class="m" title="${esc(dm ? t('upgradeTipDps', { gain: signed(r.upgrade.gain), cost: fmt(r.upgrade.cost) }) : t('upgradeTip', { hp: fmt(r.upgrade.hp), gain: fmt(r.upgrade.gain), cost: fmt(r.upgrade.cost) }))}">↑ ${dm ? fmtEff(r.upgrade.eff) : fmt(r.upgrade.eff, 2)}</span>`
          : '–')
        : (dm ? fmtEff(dpsEffOf(r)) : fmt(effOf(r), 2));
      html += `<tr class="${r.pve ? 'pve' : 'hp'}${r.keep ? ' keep' : ''}"><td>${nodeLink(r.node)} <span class="tag ${r.pve ? 'pve' : 'hp'}">${tag}</span></td>
        <td>${statLine(r)}</td><td class="n">${r.keep ? '–' : pct(r.P, r.P < 0.1 ? 2 : 1)}</td><td class="n">${r.keep ? '–' : fmt(r.expRolls, 1)}</td>
        <td class="n">${fmt(r.cost)}</td><td class="n">${fmt(r.hp)}${!r.keep && r.cur ? ` <span class="m">(+${fmt(g)})</span>` : ''}</td>
        ${dm ? `<td class="n">${fmt(r.dps)}${!r.keep && r.cur ? ` <span class="m">(${signed(dpsGainOf(r))})</span>` : ''}</td>` : ''}
        <td class="n">${effCell}</td></tr>`;
    }
    const effTotal = cost > 0 ? (dm ? fmtEff(dpsGain / cost) : fmt(gain / cost, 2)) : '–';
    html += `<tr><td colspan="2">${t('sumRow', { nPve, nHp: rows.length - nPve, nKeep })}</td><td></td><td class="n"><b>${fmt(rolls)}</b></td>
      <td class="n"><b>${fmt(cost)}</b></td><td class="n"><b>${fmt(hp)}</b></td>${dm ? `<td class="n"><b>${fmt(dps)}</b></td>` : ''}<td class="n"><b>${effTotal}</b></td></tr>`;
    const hasCurrent = curStats().n > 0;
    const idleP = { idle: p.nodeCount - rows.length, hasCurrent, hp: fmt(hp), stigmaHp: fmt(p.stigmaHp), total: fmt(hp + p.stigmaHp), used: p.usedSlots, slots: state.slots, dps: fmt(dps) };
    $('plan').innerHTML = `<div class="scroll"><table><thead><tr><th>${t('thNode')}</th><th>${t('thAccepted')}</th><th class="n">${t('thChance')}</th><th class="n">${t('thRerolls')}</th><th class="n">${t('thMp')}</th><th class="n">${t('thHp')}</th>${dm ? `<th class="n">${t('thDps')}</th>` : ''}<th class="n" title="${esc(t(dm ? 'thEffDpsTip' : 'thEffTip'))}">${t(dm ? 'thEffDps' : 'thEff')}</th></tr></thead><tbody>${html}</tbody></table></div>
      <div class="note">${t(dm ? 'noteIdleDps' : 'noteIdle', idleP)}
      ${p.auto ? t('noteStigma', { cost: fmt(p.cost), from: E.stigmaLevel(p.spent0), to: p.stigmaLevel, hp: fmt(p.stigmaHp) }) : ''}
      ${t(dm ? 'noteEffDps' : 'noteEff')}${byEff ? t(dm ? 'noteSortedDps' : 'noteSorted') : ''}</div>`;
    renderMap(p, s);
    renderStats();
    $('plansec').hidden = false;
    $('plantitle').textContent = dm ? t('planTitleDps', { dps: fmt(p.dps) }) : t('planTitle', { slots: state.slots });
  }

  // ---- stats overview (right column) -------------------------------------------------------------
  const rankNameAt = (hp) => { const r = [...E.RANKS].reverse().find((x) => hp >= x.hp); return r ? r.name : 'Seraphim'; };
  function statGroup(name) {
    const b = E.baseName(name);
    if (/^Resist /.test(b)) return 'defensive';
    const c = catOf(name);
    if (c === 'offensive' || c === 'modifier') return 'offensive';
    if (c === 'defensive') return 'defensive';
    return /Skill Amplification|Attack Up/.test(b) ? 'offensive' : 'other';
  }
  const isPercentStat = (name) => {
    const b = E.baseName(name), c = CATS[camel(b)];
    return c ? c[3] === true : /Skill Amplification/.test(b);
  };
  const statValue = (name, v) => `${fmt(v, Math.abs(v - Math.round(v)) < 0.05 ? 0 : 1)}${isPercentStat(name) ? '%' : ''}`;

  let dpsOpen = false;   // the total DPS starts as a one-liner
  let statsOpen = true; // collapsed state is not persisted, like the guide
  function toggleDps() { dpsOpen = !dpsOpen; renderStats(); }
  function toggleStats() { statsOpen = !statsOpen; renderStats(); }

  function renderStats() {
    const add = (T, k, v) => { T[k] = (T[k] || 0) + v; };
    const now = {}; let nowHp = stigmaHpNow();
    for (const id of Object.keys(state.current)) { const r = rollOf(+id); add(now, r.stat, r.value); nowHp += r.hp; }
    // goal mode: expected stats once the plan is executed (kept rolls count as they are)
    let after = null, afterHp = 0;
    const p = state.plan;
    if (state.mode === 'goal' && p && p.rows.length && isFinite(p.cost)) {
      after = {}; afterHp = p.stigmaHp;
      for (const r of p.rows) {
        afterHp += r.hp;
        if (r.keep) add(after, r.stats[0].stat, r.stats[0].minValue);
        else for (const st of r.stats) add(after, st.stat, st.ev / r.P);
      }
    }
    const rankText = t('statsRank', { now: rankNameAt(nowHp), after: after ? rankNameAt(afterHp) : null });
    const cols = after ? 3 : 2;
    const row = (n, a, b) => `<tr><td>${esc(n)}</td><td class="n${a > 0.05 ? '' : ' dim'}">${a > 0.05 ? statValue(n, a) : '–'}</td>${after ? `<td class="n${b > 0.05 ? '' : ' dim'}">${b > 0.05 ? statValue(n, b) : '–'}</td>` : ''}</tr>`;
    // rank bonuses first, listed separately from the node rolls below
    const nowB = E.rankBonus(nowHp), afterB = after ? E.rankBonus(afterHp) : {};
    let body = `<tr class="zone"><td colspan="${cols}">${t('statsRankBonus')}</td></tr>`;
    for (const n of [...new Set([...Object.keys(nowB), ...Object.keys(afterB)])].sort((x, y) => x.localeCompare(y))) body += row(n, nowB[n] || 0, afterB[n] || 0);
    const names = [...new Set([...Object.keys(now), ...Object.keys(after || {})])].filter((k) => (now[k] || 0) > 0 || ((after || {})[k] || 0) > 0.05);
    if (!names.length) body += `<tr><td colspan="${cols}" class="m">${t('statsEmpty')}</td></tr>`;
    for (const [g, key] of [['offensive', 'statsOffense'], ['defensive', 'statsDefense'], ['other', 'statsOther']]) {
      const list = names.filter((n) => statGroup(n) === g).sort((x, y) => x.localeCompare(y));
      if (!list.length) continue;
      body += `<tr class="zone"><td colspan="${cols}">${t(key)}</td></tr>`;
      for (const n of list) body += row(n, now[n] || 0, after ? (after[n] || 0) : 0);
    }
    // total DPS (only with DPS values): node rolls plus the stats of the rank bonuses
    const dm = weightsOn();
    $('dpspanel').hidden = !dm;
    if (dm) {
      const sumW = (T) => Object.entries(T).reduce((a, [k, v]) => a + dpsOfRoll(k, v), 0);
      const nN = sumW(now), nR = sumW(nowB), aN = after ? sumW(after) : 0, aR = after ? sumW(afterB) : 0;
      const dRow = (label, a, b, cls) => `<tr${cls ? ` class="${cls}"` : ''}><td>${label}</td><td class="n">${fmt(a)}</td>${after ? `<td class="n">${fmt(b)}</td>` : ''}</tr>`;
      const head = (open) => `<div class="ttl tg" role="button" tabindex="0" aria-expanded="${open}">${t('dpsTotalTitle')}</div>`;
      if (!dpsOpen) {   // collapsed: one line with the final value
        $('dpsbody').innerHTML = `<div class="dpsline">${head(false)}<b>${after ? `${fmt(nN + nR)} → ${fmt(aN + aR)}` : fmt(nN + nR)}</b></div>`;
      } else $('dpsbody').innerHTML = `<table class="stat"><thead><tr><th class="rk">${head(true)}</th><th class="n">${t('statsNow')}</th>${after ? `<th class="n">${t('statsAfter')}</th>` : ''}</tr></thead>
        <tbody>${dRow(t('dpsNodes'), nN, aN)}${dRow(t('dpsRank'), nR, aR)}${dRow(t('dpsTotal'), nN + nR, aN + aR, 'tot')}</tbody></table>`;
    }
    $('statpanel').classList.toggle('collapsed', !statsOpen);
    $('statbody').innerHTML = `<table class="stat"><thead><tr><th class="rk"><div class="ttl" role="button" tabindex="0" aria-expanded="${statsOpen}">${t('statsTitle')}</div><div class="rank">${rankText}</div></th><th class="n">${t('statsNow')}</th>${after ? `<th class="n">${t('statsAfter')}</th>` : ''}</tr></thead><tbody>${body}</tbody></table>`;
  }

  // ---- node map ----------------------------------------------------------------------------------
  const NODES = JSON.parse(document.getElementById('nodes').textContent);
  const BASE_SVG = document.getElementById('basesvg').textContent.trim();
  const abbr = (stat) => { const w = E.baseName(stat).split(' '); return w.length > 1 ? w.map((x) => x[0]).join('').toUpperCase() : w[0].slice(0, 3).toUpperCase(); };
  let mapRows = {};
  const NODE_R = 25;
  const nodeText = (y, size, weight, fill, content) => `<text y="${y}" text-anchor="middle" font-size="${size}" font-weight="${weight}" fill="${fill}">${content}</text>`;
  const levelLabel = (text) => `<text y="${NODE_R + 12}" text-anchor="middle" font-size="13" font-weight="700" fill="#4ecb8d" stroke="#0a0b0d" stroke-width="3" paint-order="stroke">${text}</text>`;
  const checkBadge = (stroke) => `<g transform="translate(18 -18)"><circle r="8" fill="#0d0f14" stroke="${stroke}" stroke-width="1.5"/><text y="4" text-anchor="middle" font-size="11" font-weight="700" fill="${stroke}">✓</text></g>`;
  const STYLE_OFF = { fill: 'rgba(40,44,56,.85)', stroke: '#4a5266', inner: nodeText(5, 16, 400, '#6b748a', '–') };

  // Draws the board. styleOf(id) -> { fill, stroke, inner, under, badge }; tipOf(id) -> tooltip html.
  function drawMap(styleOf, tipOf, title) {
    let g = `<image href="data:image/svg+xml;base64,${BASE_SVG}" x="0" y="0" width="1382" height="880"/>`;
    for (const n of NODES) {
      const st = styleOf(n.id);
      if (state.nodeRules[n.id]) g += `<circle cx="${n.x}" cy="${n.y}" r="${NODE_R + 6}" fill="none" stroke="#f0b429" stroke-width="2" stroke-dasharray="4 3"/>`;
      if (state.selNode === n.id) g += `<circle cx="${n.x}" cy="${n.y}" r="${NODE_R + 10}" fill="none" stroke="#ffffff" stroke-width="2.5" opacity=".85"/>`;
      g += `<g class="nd" data-n="${n.id}" transform="translate(${n.x} ${n.y})"><circle class="c" r="${NODE_R}" fill="${st.fill}" stroke="${st.stroke}" stroke-width="2.5"/>${st.inner}${st.under || ''}${st.badge || ''}</g>`;
    }
    $('map').innerHTML = `<svg viewBox="0 0 1382 880" id="mapsvg">${g}</svg>`;
    $('mapsec').hidden = false;
    $('maptitle').textContent = title;
    const wrap = $('mapwrap'), tip = $('mtip');
    const show = (ev) => {
      const el = ev.target.closest('.nd'); if (!el) { tip.hidden = true; return; }
      tip.innerHTML = tipOf(+el.dataset.n); tip.hidden = false;
      const wr = wrap.getBoundingClientRect();
      let x = ev.clientX - wr.left + 14, y = ev.clientY - wr.top + 14;
      if (x + tip.offsetWidth > wr.width - 6) x = ev.clientX - wr.left - tip.offsetWidth - 14;
      if (y + tip.offsetHeight > wr.height - 6) y = Math.max(6, wr.height - tip.offsetHeight - 6);
      tip.style.left = Math.max(6, x) + 'px'; tip.style.top = y + 'px';
    };
    const svg = $('mapsvg');
    svg.onpointermove = show; svg.onpointerdown = show;
    svg.onpointerleave = () => { tip.hidden = true; };
    svg.onclick = (ev) => {
      const el = ev.target.closest('.nd'); if (!el) return;
      const id = +el.dataset.n; state.selNode = state.selNode === id ? null : id;
      redrawMap(); renderEditor();
    };
  }

  // goal mode: nodes colored by the plan
  function renderMap(p) {
    mapRows = {}; p.rows.forEach((r) => (mapRows[r.node] = r));
    const styleOf = (id) => {
      const r = mapRows[id];
      if (!r) return STYLE_OFF;
      const badge = r.keep ? checkBadge(r.pve ? '#4ecb8d' : '#6aa9ff') : '';
      if (r.pve) {
        const m = r.stats[0];
        return { fill: 'rgba(78,203,141,.16)', stroke: '#4ecb8d', badge, under: levelLabel(`${m.minLevel}/${m.maxLevel}`),
          inner: nodeText(5, r.stats.length > 1 ? 13 : 15, 700, '#bff2d8', `${abbr(m.stat)}${r.stats.length > 1 ? '+' : ''}`) };
      }
      return { fill: 'rgba(106,169,255,.14)', stroke: '#6aa9ff', badge, inner: nodeText(5, 14, 600, '#cfe2ff', `${r.keep ? '' : '≥'}${r.hp}`) };
    };
    const tipOf = (id) => {
      const r = mapRows[id];
      let h = t('tipHeader', { id, cost: E.NODE_COST[id - 1] });
      if (!r) return h + `<div class="st m">${t('tipNotRolled')}</div>`;
      if (r.keep) {
        const c = r.stats[0];
        h += `<div class="st">${t('tipKeepHead', { pve: r.pve })}</div>`;
        h += `<div>${t('tipKeepStat', { stat: esc(c.stat), lv: c.minLevel, max: c.maxLevel, value: fmt(c.minValue) })}</div><div class="m">${t('tipKeepHp', { hp: fmt(r.hp) })}</div>`;
        if (r.upgrade) {
          h += `<div class="st m">${planDps() ? t('tipUpgradeDps', { gain: signed(r.upgrade.gain), cost: fmt(r.upgrade.cost), eff: fmtEff(r.upgrade.eff) })
            : t('tipUpgrade', { hp: fmt(r.upgrade.hp), gain: fmt(r.upgrade.gain), cost: fmt(r.upgrade.cost), eff: fmt(r.upgrade.eff, 2) })}</div>`;
        }
        return h;
      }
      h += `<div class="st"><span class="tag ${r.pve ? 'pve' : 'hp'}">${r.pve ? 'PvE' : 'HP'}</span> ${r.pve ? t('tipAccepts') : t('tipAnyRoll', { hp: fmt(r.hp) })}</div>`;
      if (r.pve) h += r.stats.map((x) => `<div>${t('tipStat', { stat: esc(x.stat), value: fmt(x.minValue), lo: x.minLevel, hi: x.maxLevel })}</div>`).join('');
      h += `<div class="st m">${t('tipChance', { chance: pct(r.P, r.P < 0.1 ? 2 : 1), rolls: fmt(r.expRolls, 1), cost: fmt(r.cost) })}</div>`;
      h += `<div class="m">${t('tipHp', { hp: fmt(r.hp), gain: r.cur ? fmt(gainOf(r)) : null, eff: fmt(effOf(r), 2) })}</div>`;
      if (planDps()) h += `<div class="m">${t('tipDps', { dps: fmt(r.dps), gain: r.cur ? signed(dpsGainOf(r)) : null, eff: fmtEff(dpsEffOf(r)) })}</div>`;
      if (r.cur) h += `<div class="m">${t('tipCurrent', { stat: esc(r.cur.stat), lv: r.cur.level, max: r.cur.maxLevel, hp: fmt(r.cur.hp) })}</div>`;
      return h;
    };
    drawMap(styleOf, tipOf, t('mapTitle', { n: p.rows.filter((r) => r.pve).length }));
  }

  // upgrade mode: PvE nodes that can be improved, numbered by rank in the upgrade list
  function drawUpMap(list) {
    const byNode = {}; list.forEach((u) => (byNode[u.node] = u));
    const styleOf = (id) => {
      const u = byNode[id];
      if (u) {
        const multi = !u.cur && u.best.accepts.length > 1;
        return { fill: 'rgba(78,203,141,.16)', stroke: '#4ecb8d',
          inner: nodeText(5, 15, 700, '#bff2d8', `${abbr(u.cur ? u.cur.stat : u.best.accepts[0].stat)}${multi ? '+' : ''}`),
          under: u.cur ? levelLabel(`${u.cur.level}/${u.cur.maxLevel}`) : '',
          badge: `<g transform="translate(-19 -19)"><circle r="10" fill="#0d0f14" stroke="#f0b429" stroke-width="1.5"/><text y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#f0b429">${u.order}</text></g>` };
      }
      if (state.current[id]) return { fill: 'rgba(106,169,255,.14)', stroke: '#6aa9ff', inner: nodeText(5, 14, 600, '#cfe2ff', rollOf(id).hp) };
      return STYLE_OFF;
    };
    const tipOf = (id) => {
      const u = byNode[id];
      let h = t('tipHeader', { id, cost: E.NODE_COST[id - 1] });
      if (u) {
        h += `<div class="st"><span class="tag pve">PvE</span> ${t('tipUpOrder', { n: u.order })}</div>`;
        h += `<div class="m">${u.cur ? t('tipUpCurrent', { stat: esc(u.cur.stat), lv: u.cur.level, max: u.cur.maxLevel, hp: fmt(u.cur.hp) }) : t('tipUpNone')}</div>`;
        h += `<div class="st">${t('tipUpRoll')}</div>` + u.best.accepts.map((x) => `<div>${t('tipStat', { stat: esc(x.stat), value: fmt(x.minValue), lo: x.minLevel, hi: x.maxLevel })}</div>`).join('');
        h += `<div class="st m">${t('tipChance', { chance: pct(u.best.P, u.best.P < 0.1 ? 2 : 1), rolls: fmt(1 / u.best.P, 1), cost: fmt(u.best.cost) })}</div>`;
        h += `<div class="m">${state.upDps ? t('tipUpGainDps', { dps: signed(u.best.gainDps, 1), exp: signed(u.best.gainExp, 1), eff: fmtEff(u.best.eff) })
          : t('tipUpGain', { exp: signed(u.best.gainExp, 1), min: signed(u.best.gainMin), eff: fmt(u.best.eff, 2) })}</div>`;
      } else if (state.current[id]) {
        const c = rollOf(id);
        h += `<div class="st m">${t('tipUpOther', { stat: esc(c.stat), lv: c.level, max: c.maxLevel, hp: fmt(c.hp) })}</div>`;
      } else h += `<div class="st m">${t('tipUpEmpty')}</div>`;
      return h;
    };
    drawMap(styleOf, tipOf, t('mapTitleUp', { n: list.length }));
  }

  // ---- upgrade view (after the goal) -------------------------------------------------------------
  function renderUpgradeView() {
    const dm = weightsOn();
    state.upDps = dm;
    const rows = E.upgradeCandidates(DATA, { allowed: pveSet(), weights: dm ? activeWeights() : undefined, nodeRules: state.nodeRules, current: state.current, scope: state.upAll ? 'all' : 'pve' });
    const cs = curStats();
    let dpsNow = 0;
    for (const id of Object.keys(state.current)) { const r = rollOf(+id); dpsNow += dpsOfRoll(r.stat, r.value); }
    refreshModeTexts();
    const stigmaHp = stigmaHpNow();
    const total = cs.hp + stigmaHp;
    const rankNow = [...E.RANKS].reverse().find((r) => total >= r.hp), rankNext = E.RANKS.find((r) => r.hp > total);
    const reached = new Set(E.RANKS.filter((r) => r.hp <= total).map((r) => r.id));
    let cumMp = 0, cumHp = 0, cumDps = 0;
    const list = rows.map((r, i) => {
      cumMp += r.best.cost; cumHp += r.best.gainExp; cumDps += r.best.gainDps;
      const crossing = E.RANKS.filter((k) => !reached.has(k.id) && total + cumHp >= k.hp);
      crossing.forEach((k) => reached.add(k.id));
      return { ...r, order: i + 1, cumMp, totalHp: total + cumHp, totalDps: dpsNow + cumDps, crossing };
    });
    state.up = list;
    renderStats();

    $('upinfo').innerHTML = t('upInfo', { n: cs.n, hp: fmt(cs.hp), st: fmt(stigmaHp), total: fmt(total), rank: rankNow ? rankNow.name : 'Seraphim' })
      + (rankNext ? t('upNextRank', { missing: fmt(rankNext.hp - total), next: rankNext.name, nextHp: fmt(rankNext.hp) }) : t('upTopRank'));
    if (!list.length) {
      $('uptable').innerHTML = `<div class="hint">${t('upEmpty')}</div>`;
    } else {
      const body = list.map((u) => `<tr class="pve${u.order === 1 ? ' next' : ''}"><td>${nodeLink(u.node)}</td>
        <td>${u.cur ? t('upCurrent', { stat: esc(u.cur.stat), lv: u.cur.level, max: u.cur.maxLevel }) + `<br><span class="m">${fmt(u.cur.hp)} HP</span>` : `<span class="m">${t('upNotEntered')}</span>`}</td>
        <td>${u.best.accepts.map((x) => `<span class="acc">${esc(x.stat)} <i>≥ ${fmt(x.minValue)} (Lv ${x.minLevel}+)</i></span>`).join('<br>')}</td>
        <td class="n">${pct(u.best.P, u.best.P < 0.1 ? 2 : 1)}</td><td class="n">${fmt(1 / u.best.P, 1)}</td><td class="n">${fmt(u.best.cost)}</td>
        ${dm ? `<td class="n">${signed(u.best.gainDps, 1)}</td>` : ''}
        <td class="n">${t('upGain', { exp: signed(u.best.gainExp, 1), min: signed(u.best.gainMin) })}</td><td class="n"><b>${dm ? fmtEff(u.best.eff) : fmt(u.best.eff, 2)}</b></td>
        <td class="n">${fmt(u.cumMp)}</td>${dm ? `<td class="n">${fmt(u.totalDps)}</td>` : ''}<td class="n">${fmt(u.totalHp)} ${u.crossing.map((k) => `<span class="tag pve">${t('upReaches', { rank: k.name })}</span>`).join(' ')}</td></tr>`).join('');
      $('uptable').innerHTML = `<div class="scroll"><table><thead><tr><th>${t('thNode')}</th><th>${t('upThCurrent')}</th><th>${t('upThAccepts')}</th><th class="n">${t('thChance')}</th><th class="n">${t('thRerolls')}</th><th class="n">${t('thMp')}</th>
        ${dm ? `<th class="n" title="${esc(t('upThGainDpsTip'))}">${t('upThGainDps')}</th>` : ''}<th class="n" title="${esc(t('upThGainTip'))}">${t('upThGain')}</th><th class="n" title="${esc(t(dm ? 'upThEffDpsTip' : 'upThEffTip'))}">${t(dm ? 'thEffDps' : 'thEff')}</th><th class="n">${t('upThSum')}</th>${dm ? `<th class="n">${t('upThTotalDps')}</th>` : ''}<th class="n">${t('upThTotal')}</th></tr></thead><tbody>${body}</tbody></table></div>
        <div class="note">${t('upNote')}</div>`;
    }
    setStatus('up', { n: list.length });
    drawUpMap(list);
  }

  // ---- mode switch -------------------------------------------------------------------------------
  function applyMode() {
    const up = state.mode === 'upgrade';
    document.addEventListener('click', (ev) => {
      const a = ev.target.closest('.nodelink'); if (!a) return;
      ev.preventDefault(); selectNode(+a.dataset.node);
    });
    document.querySelectorAll('.modes button').forEach((b) => b.classList.toggle('on', b.dataset.mode === state.mode));
    applyLegend();
    $('cards').hidden = up; $('chartpanel').hidden = up; $('rankbox').hidden = up; $('upsec').hidden = !up;
    if (up) { $('plansec').hidden = true; renderUpgradeView(); }
    else { if (state.plan) renderMap(state.plan); else $('mapsec').hidden = true; scheduleSolve(); }
  }
  function setMode(m) {
    if (m === state.mode) return;
    state.mode = m; saveState(); applyMode(); renderEditor();
  }

  // ---- per-node editor: current roll, PvE stats, forced PvE slot ----------------------------------
  const nodeAvail = (id) => [...new Set(DATA[id - 1].stats.map((x) => x.name).filter((x) => !E.isPvp(x)).map(E.baseName))].sort();
  const zoneNo = (id) => E.ZONES.findIndex((z) => id >= z.from && id <= z.to) + 1;
  const redrawMap = () => { if (state.mode === 'upgrade') { if (state.up) drawUpMap(state.up); } else if (state.plan) renderMap(state.plan); };
  function selectNode(id) {
    state.selNode = id;
    renderEditor(); redrawMap();
    $('nodeedit').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  function ruleText(id) {
    const r = state.nodeRules[id];
    const stats = r.stats ? (r.stats.length ? r.stats.join(' / ') : t('ruleNoStat')) : t('ruleDefault');
    return t('ruleText', { id, stats, force: r.force });
  }
  function renderEditor() {
    const box = $('nodeedit'); if (!box) return;
    const ids = Object.keys(state.nodeRules).map(Number).sort((a, b) => a - b);
    const summary = ids.length ? `<div class="rules">${ids.map((i) => `<span class="rule"><a href="#" data-sel="${i}">${esc(ruleText(i))}</a> <button type="button" data-del="${i}" title="${esc(t('ruleRemove'))}">×</button></span>`).join('')}</div>` : '';
    const cs = curStats();
    const istLine = `<div class="istline"><span>${t('istLine', { n: cs.n, hp: fmt(cs.hp) })}</span>${cs.n ? `<button type="button" id="ist-clear">${t('istClear')}</button>` : ''}</div>`;
    const id = state.selNode;
    if (!id) { box.innerHTML = `<div class="hint">${t('editorHint')}</div>${istLine}${summary}`; wireEditor(); return; }
    const avail = nodeAvail(id), rule = state.nodeRules[id] || {};
    const pveNow = pveSet();
    const cur = new Set(rule.stats || avail.filter((b) => pveNow.has(b)));
    const nstats = DATA[id - 1].stats, bonus = E.ZONES[zoneNo(id) - 1].bonus;
    const cr = state.current[id];
    const crStat = cr ? nstats.find((x) => x.name === cr.stat) : null;
    const pveStats = new Set(rule.stats || pveNow);
    const planRow = state.mode === 'goal' && state.plan ? state.plan.rows.find((x) => x.node === id) : null;
    // PvE slot: only PvE stats can be entered (unless "show all stats" is ticked); HP slot: every non-PvP stat
    const pveNode = !!(planRow && planRow.pve) && !state.allRoll;
    const pickable = nstats.filter((x) => (!E.isPvp(x.name) && (!pveNode || pveStats.has(E.baseName(x.name)))) || (cr && cr.stat === x.name));
    const lab = (name) => (/^Pve /.test(name) && !nstats.some((x) => x.name === name.slice(4)) ? name.slice(4) : name);
    const optHtml = (x) => `<option value="${esc(x.name)}" ${cr && cr.stat === x.name ? 'selected' : ''}>${esc(lab(x.name))}</option>`;
    const sorted = [...pickable].sort((a, b) => lab(a.name).localeCompare(lab(b.name)));
    box.innerHTML = `<div class="ed"><div class="edh"><button type="button" id="ed-prev" title="${esc(t('edPrev'))}">◀</button><button type="button" id="ed-next" title="${esc(t('edNext'))}">▶</button>
        ${t('edHeader', { id, zone: zoneNo(id), cost: E.NODE_COST[id - 1] })}
        <button type="button" id="ed-reset">${t('edResetRules')}</button><button type="button" id="ed-close">${t('edClose')}</button></div>
      <div class="curroll"><span class="m">${t('edCurrentRoll')}</span>
        <select id="cur-stat"><option value="">${t('edNotEntered')}</option>${sorted.map(optHtml).join('')}</select>
        <select id="cur-level" ${crStat ? '' : 'disabled'}>${crStat ? crStat.levels.map((l) => `<option value="${l.level}" ${cr.level === l.level ? 'selected' : ''}>${t('edLevelOption', { lv: l.level, n: crStat.levels.length, value: fmt(l.value), hp: fmt(l.holyPower + bonus) })}</option>`).join('') : ''}</select>
        <button type="button" id="cur-clear" ${cr ? '' : 'disabled'} title="${esc(t('edResetCurrentTip'))}">${t('edResetCurrent')}</button>
        ${planRow && planRow.pve ? `<label class="chk"><input type="checkbox" id="cur-all" ${state.allRoll ? 'checked' : ''}> ${t('edShowAll')}</label>` : ''}</div>
      <div class="m" style="margin:10px 0 4px">${t('edPveStats')}</div>
      <div class="edstats">${avail.map((b) => `<label><input type="checkbox" data-b="${esc(b)}" ${cur.has(b) ? 'checked' : ''}> ${esc(b)}</label>`).join('')}</div>
      <label class="chk" style="margin-top:8px"><input type="checkbox" id="ed-force" ${rule.force ? 'checked' : ''}> ${t('edForce')}</label></div>${istLine}${summary}`;
    const refresh = () => { renderEditor(); if (state.mode === 'goal') redrawMap(); changed(); };
    const apply = () => {
      const set = [...box.querySelectorAll('input[data-b]')].filter((i) => i.checked).map((i) => i.dataset.b).sort();
      const def = avail.filter((b) => pveNow.has(b)).sort();
      const force = $('ed-force').checked;
      const same = set.length === def.length && set.every((x, i) => x === def[i]);
      if (same && !force) delete state.nodeRules[id]; else state.nodeRules[id] = { stats: same ? null : set, force };
      refresh();
    };
    box.querySelectorAll('input').forEach((i) => (i.onchange = apply));
    $('cur-stat').onchange = () => {
      const v = $('cur-stat').value;
      if (!v) delete state.current[id]; else state.current[id] = { stat: v, level: nstats.find((x) => x.name === v).levels[0].level };
      refresh();
    };
    const allBox = $('cur-all'); if (allBox) allBox.onchange = () => { state.allRoll = allBox.checked; renderEditor(); };
    $('cur-clear').onclick = () => { delete state.current[id]; refresh(); };
    $('cur-level').onchange = () => { state.current[id].level = parseInt($('cur-level').value, 10); refresh(); };
    const go = (d) => { state.selNode = ((id - 1 + d + 78) % 78) + 1; renderEditor(); redrawMap(); };
    $('ed-prev').onclick = () => go(-1); $('ed-next').onclick = () => go(1);
    $('ed-reset').onclick = () => { delete state.nodeRules[id]; refresh(); };
    $('ed-close').onclick = () => { state.selNode = null; renderEditor(); redrawMap(); };
    wireEditor();
  }
  function wireEditor() {
    const box = $('nodeedit');
    box.querySelectorAll('[data-del]').forEach((b) => (b.onclick = () => { delete state.nodeRules[+b.dataset.del]; renderEditor(); if (state.mode === 'goal') redrawMap(); changed(); }));
    const clr = $('ist-clear');
    if (clr) {
      // two-step confirm (window.confirm is not reliable in embedded browsers)
      let armed = false, timer = null;
      clr.onclick = () => {
        if (!armed) {
          armed = true; clr.textContent = t('istConfirm'); clr.classList.add('danger');
          timer = setTimeout(() => { armed = false; clr.textContent = t('istClear'); clr.classList.remove('danger'); }, 3500);
          return;
        }
        clearTimeout(timer); state.current = {}; renderEditor(); if (state.mode === 'goal') redrawMap(); changed();
      };
    }
    box.querySelectorAll('[data-sel]').forEach((a) => (a.onclick = (ev) => { ev.preventDefault(); state.selNode = +a.dataset.sel; renderEditor(); redrawMap(); }));
  }

  // the async clipboard API is missing in some contexts (e.g. non-secure pages); fall back to a hidden textarea
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
    return new Promise((resolve, reject) => {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { /* ignore */ }
      ta.remove();
      if (ok) resolve(); else reject(new Error('copy failed'));
    });
  }

  function copyPlan() {
    const p = state.plan; if (!p) return;
    const rank = E.RANKS.find((r) => r.id === state.rankId);
    const dm = !!p.dpsMode, cost = fmt(sel().cost);
    const lines = [dm ? t('copyHeaderDps', { rank: rank.name, stigma: state.stigma, dps: fmt(p.dps), cost })
      : t('copyHeader', { rank: rank.name, stigma: state.stigma, slots: state.slots, cost })];
    for (const r of sortedRows(p.rows)) {
      if (r.keep) { lines.push(t('copyStays', { node: r.node, stat: r.stats[0].stat, lv: r.stats[0].minLevel })); continue; }
      const what = r.pve ? r.stats.map((s) => `${s.stat} ≥ ${s.minValue}`).join(' | ') : t('copyRoll', { hp: r.hp });
      lines.push(t(dm ? 'copyLineDps' : 'copyLine', { node: r.node, tag: r.pve ? 'PvE' : 'HP ', what, chance: pct(r.P, 2), cost: fmt(r.cost), eff: dm ? fmtEff(dpsEffOf(r)) : fmt(effOf(r), 2) }));
    }
    copyText(lines.join('\n')).then(() => {
      $('copy').textContent = t('copied');
      setTimeout(() => ($('copy').textContent = t('btnCopy')), 1500);
    });
  }

  function setSlots(k) {
    if (!state.solved) return;
    applySelection({ k, point: null });
  }
  function applySelection(pk) {
    if (!state.solved) return;
    state.slots = Math.max(0, Math.min(state.solved.KMAX, pk.k)); state.point = pk.point;
    $('slots').value = state.slots;
    renderCards(); renderChart(); requestPlan();
  }

  // ---- controls ----------------------------------------------------------------------------------
  function buildRankOptions() {
    $('rank').innerHTML = E.RANKS.map((r) => `<option value="${r.id}" ${r.id === state.rankId ? 'selected' : ''}>${r.name} (${fmt(r.hp)} HP)</option>`).join('');
  }
  function buildStatList() {
    let h = '';
    GROUP_KEYS.forEach((key, gi) => {
      const members = baseStats.filter((x) => groupOf(x) === gi);
      if (!members.length) return;
      h += `<div class="grp">${t(key)}</div>`;
      for (const b of members) h += `<label><input type="checkbox" data-s="${b}" ${allowed.has(b) ? 'checked' : ''}> ${b}</label>`;
    });
    $('stats').innerHTML = h;
  }

  // ---- optional DPS values -----------------------------------------------------------------------
  const tipDefault = () => t(state.solved && state.solved.dpsMode ? 'chartTipDefaultDps' : 'chartTipDefault');
  // texts of the cost chart and the upgrade list depend on the objective
  function refreshModeTexts() {
    const dm = state.solved ? state.solved.dpsMode : weightsOn();
    $('hcost').textContent = t(dm ? 'hCostDps' : 'hCost');
    $('lblslots').textContent = t(dm ? 'lblSlotsDps' : 'lblSlots');
    $('upintro').textContent = t(weightsOn() ? 'upIntroDps' : 'upIntro');
    $('sortsel').querySelector('option[value="eff"]').textContent = t(dm ? 'optSortEffDps' : 'optSortEff');
    $('tip').textContent = tipDefault();
  }
  function updateDpsUi() {
    const on = weightsOn();
    $('dpsflag').hidden = !on;
    $('stats').classList.toggle('off', on);
    $('pvedps').hidden = !on;
  }
  function buildDpsList() {
    $('dpsgrid').innerHTML = OFFENSIVE.map((b, i) => `<label for="w${i}">${esc(b)}</label><input id="w${i}" type="text" inputmode="decimal" autocomplete="off" placeholder="0" data-w="${esc(b)}" value="${state.weights[b] || ''}">`).join('');
  }
  function dpsChanged() { updateDpsUi(); if (state.mode !== 'goal') refreshModeTexts(); changed(); }

  function buildControls() {
    buildDpsList(); updateDpsUi();
    $('dpsgrid').onchange = (ev) => {
      const b = ev.target.dataset.w; if (!b) return;
      const v = parseFloat(String(ev.target.value).trim().replace(',', '.'));   // comma or dot as the decimal mark
      if (v > 0 && isFinite(v)) { state.weights[b] = v; ev.target.value = String(v); } else { delete state.weights[b]; ev.target.value = ''; }
      dpsChanged();
    };
    $('dpsclear').onclick = () => { state.weights = {}; buildDpsList(); dpsChanged(); };
    // the title cell is re-rendered with the table, so listen on the container
    $('dpsbody').addEventListener('click', (e) => { if (e.target.closest('.tg')) toggleDps(); });
    $('dpsbody').addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('.tg')) { e.preventDefault(); toggleDps(); } });
    $('statbody').addEventListener('click', (e) => { if (e.target.closest('.ttl')) toggleStats(); });
    $('statbody').addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('.ttl')) { e.preventDefault(); toggleStats(); } });
    $('rank').onchange = () => { state.rankId = $('rank').value; changed(); };   // a budget you set stays when the rank changes
    $('stmode').value = state.stigmaMode; $('stlevel').value = state.stLevel; $('stprog').value = state.stProgress;
    const showSt = () => { $('st-auto').hidden = state.stigmaMode !== 'auto'; $('st-man').hidden = state.stigmaMode === 'auto'; updateStInfo(); };
    showSt();
    $('stmode').onchange = () => { state.stigmaMode = $('stmode').value; state.budgetTouched = false; showSt(); changed(); };
    const stChange = () => {
      state.stLevel = Math.min(150, Math.max(1, parseInt($('stlevel').value, 10) || 1));
      state.stProgress = Math.min(Math.max(0, E.STIGMA_COST[state.stLevel] - 1), Math.max(0, parseInt($('stprog').value, 10) || 0));
      $('stlevel').value = state.stLevel; $('stprog').value = state.stProgress;
      state.budgetTouched = false; updateStInfo(); changed();
    };
    $('stlevel').onchange = stChange; $('stprog').onchange = stChange;
    $('stigma').value = state.stigma;
    $('stigma').onchange = () => {
      state.stigma = Math.max(0, Math.min(150, parseInt($('stigma').value, 10) || 0));
      $('stigma').value = state.stigma; state.budgetTouched = false; changed();
    };
    $('budget').oninput = () => {
      state.budget = Math.max(0, parseFloat($('budget').value) || 0); state.budgetTouched = true;
      if (state.solved) applySelection(pickByBudget());
    };
    $('slots').oninput = () => setSlots(parseInt($('slots').value, 10));
    $('copy').onclick = copyPlan;
    $('sortsel').value = state.sort;
    $('sortsel').onchange = () => { state.sort = $('sortsel').value; renderPlan(); };
    $('stats').onchange = (ev) => {
      const b = ev.target.dataset.s; if (!b) return;
      if (ev.target.checked) allowed.add(b); else allowed.delete(b);
      changed();
    };
    document.querySelectorAll('.lang button').forEach((b) => (b.onclick = () => setLang(b.dataset.lang)));
    document.querySelectorAll('.modes button').forEach((b) => (b.onclick = () => setMode(b.dataset.mode)));
    $('upall').checked = state.upAll;
    $('upall').onchange = () => { state.upAll = $('upall').checked; changed(); };
  }

  // the legend above the board describes different colors in each mode
  function applyLegend() {
    const keys = state.mode === 'upgrade' ? ['legUpPve', 'legUpHp', 'legUpOff'] : ['legPve', 'legHp', 'legOff'];
    document.querySelectorAll('.legend span[data-i18n]').forEach((el, i) => { el.textContent = t(keys[i]); });
  }

  // ---- language switch ---------------------------------------------------------------------------
  function applyLang() {
    document.documentElement.lang = lang;
    document.title = t('docTitle');
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-html]').forEach((el) => { el.innerHTML = t(el.dataset.i18nHtml); });
    document.querySelectorAll('.lang button').forEach((b) => b.classList.toggle('on', b.dataset.lang === lang));
    applyLegend();
    buildRankOptions(); buildStatList(); updateStInfo(); renderStatus(); renderStats();
    refreshModeTexts();
    if (state.mode === 'upgrade') renderUpgradeView();
    else {
      if (state.solved && isFinite(state.solved.best[0].cost)) renderAll();
      if (state.plan) renderPlan();
    }
    renderEditor();
  }
  function setLang(l) {
    lang = l;
    try { localStorage.setItem(LANG_KEY, l); } catch (e) { /* ignore */ }
    applyLang();
  }

  buildControls();
  applyLang();
  applyMode();
})();
</script>
</body>
</html>
